<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf4e6">
<title>키 · 몸무게 기록장 · 몽치치 패밀리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../fam/fam.css">
<style>

</style>
</head>
<body>
<main>
<div id="who"></div>
<div class="card" id="sum"></div>
<div class="mf-tabs" id="tabs"><button data-t="cm" aria-pressed="true">키</button><button data-t="kg" aria-pressed="false">몸무게</button></div>
<div class="card" id="chart"></div>
<h2 class="sec">기록</h2>
<div id="list"></div>
<button class="mf-add" id="add">+ 기록 추가</button>
</main>
<script src="../fam/fam.js"></script>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id);};
MF.head('키 · 몸무게 기록장','daily','날짜별로 적으면 얼마나 컸는지 그래프로 보여요.');
var D=MF.load('growth',[]),who=null,tab='cm';
function save(){MF.save('growth',D);}
function mineL(){return D.filter(function(x){return x.who===who;}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});}
function chart(l){var pts=l.filter(function(x){return x[tab]>0;});if(pts.length<2)return '<div class="muted" style="text-align:center;padding:18px 0">기록이 2개 이상이면 그래프가 나와요.</div>';
  var W=320,H=170,pl=38,pr=12,pt=14,pb=26,xs=pts.map(function(x){return MF.parse(x.d).getTime();}),ys=pts.map(function(x){return x[tab];}),x0=xs[0],x1=xs[xs.length-1],y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(x1===x0)x1=x0+1;var pad=Math.max(1,(y1-y0)*.15);y0=Math.floor(y0-pad);y1=Math.ceil(y1+pad);
  var X=function(v){return pl+(v-x0)/(x1-x0)*(W-pl-pr);},Y=function(v){return pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);},g='';
  for(var i=0;i<=3;i++){var v=y0+(y1-y0)*i/3;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#2a2440" stroke-opacity=".12"/><text x="'+(pl-5)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="10.5" text-anchor="end" fill="#6b6480">'+v.toFixed(0)+'</text>';}
  var path=pts.map(function(p,i){return (i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p[tab]).toFixed(1);}).join(' ');
  g+='<path d="'+path+'" fill="none" stroke="#ff6b57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map(function(p,i){return '<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p[tab]).toFixed(1)+'" r="4.5" fill="#fffdf8" stroke="#2a2440" stroke-width="2.5"/>';}).join('');
  var lab=function(p){var d=MF.parse(p.d);return String(d.getFullYear()).slice(2)+'.'+(d.getMonth()+1);};
  g+='<text x="'+pl+'" y="'+(H-7)+'" font-size="10.5" fill="#6b6480">'+lab(pts[0])+'</text><text x="'+(W-pr)+'" y="'+(H-7)+'" font-size="10.5" text-anchor="end" fill="#6b6480">'+lab(pts[pts.length-1])+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(tab==='cm'?'키':'몸무게')+' 그래프" style="width:100%;height:auto;display:block">'+g+'</svg>';}
function draw(){var l=mineL(),m=MF.member(who),last=l[l.length-1],first=l[0],unit=tab==='cm'?'cm':'kg';
  var lc=l.filter(function(x){return x.cm>0;}),lk=l.filter(function(x){return x.kg>0;});
  $('sum').innerHTML=last?'<div class="row"><div class="grow"><div class="muted">'+MF.esc(m.name)+' · '+MF.day(last.d,true)+'</div><div class="big">'+(lc.length?lc[lc.length-1].cm+'cm':'')+(lc.length&&lk.length?' · ':'')+(lk.length?lk[lk.length-1].kg+'kg':'')+'</div></div></div>'+
    (lc.length>1?'<div class="muted" style="margin-top:4px">처음 기록('+MF.day(lc[0].d,true)+')보다 키가 '+(lc[lc.length-1].cm-lc[0].cm).toFixed(1)+'cm 컸어요.</div>':''):'<div class="muted">'+MF.esc(m.name)+'의 기록이 아직 없어요.</div>';
  $('tabs').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===tab);});
  $('chart').innerHTML=chart(l);
  $('list').innerHTML=l.length?l.slice().reverse().map(function(x){return '<div class="card tap row" data-id="'+x.id+'"><span class="grow">'+MF.day(x.d,true)+'</span><span class="big" style="font-size:18px">'+(x.cm?x.cm+'cm':'')+(x.cm&&x.kg?' · ':'')+(x.kg?x.kg+'kg':'')+'</span></div>';}).join(''):'<div class="empty">아직 기록이 없어요.</div>';}
function edit(e){MF.form({title:e?'기록 고치기':'기록 추가',value:e||{d:MF.ymd()},fields:[{k:'d',label:'잰 날',type:'date',req:true},{k:'cm',label:'키 (cm)',type:'number',step:.1,ph:'예: 138.5'},{k:'kg',label:'몸무게 (kg)',type:'number',step:.1,ph:'예: 32.4'}],
  onSave:function(v){v.cm=+v.cm||0;v.kg=+v.kg||0;if(!v.cm&&!v.kg){MF.toast('키나 몸무게 중 하나는 넣어 주세요');return;}if(v.cm&&(v.cm<40||v.cm>230)||v.kg&&(v.kg<2||v.kg>200)){MF.toast('숫자를 다시 확인해 주세요');return;}
    if(e)Object.assign(e,v);else{v.id=MF.uid();v.who=who;D.push(v);}save();draw();MF.toast('저장했어요');},onDelete:e?function(){D=D.filter(function(x){return x!==e;});save();draw();}:null});}
$('tabs').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;tab=b.dataset.t;draw();};
$('list').onclick=function(ev){var c=ev.target.closest('[data-id]');if(c)edit(D.filter(function(x){return x.id===c.dataset.id;})[0]);};
$('add').onclick=function(){edit(null);};
MF.who($('who'),{},function(id){who=id;draw();});
})();
</script>
</body>
</html>
