<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf4e6">
<title>스케이트 기록장 · 몽치치 패밀리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../fam/fam.css">
<style>

</style>
</head>
<body>
<main>
<div id="who"></div>
<h2 class="sec">내 최고 기록</h2>
<div id="pb"></div>
<h2 class="sec">기록</h2>
<div id="list"></div>
<button class="mf-add" id="add">+ 기록 추가</button>
</main>
<script src="../fam/fam.js"></script>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id);};
MF.head('스케이트 기록장','daily','대회와 연습 기록을 모아요. 종목마다 가장 빠른 기록에 🏅가 붙어요.');
var D=MF.load('skate',[]),who=null,EV=['222m','333m','500m','777m','1000m','1500m','2000m'];
function save(){MF.save('skate',D);}
/* '45.32' 또는 '1:02.45' → 초. 잘못 쓰면 NaN */
function sec(t){t=String(t).trim().replace(',','.');var m=/^(?:(\d+):)?(\d{1,2}(?:\.\d{1,3})?)$/.exec(t);if(!m)return NaN;return (+(m[1]||0))*60+ +m[2];}
function fmt(s){var m=Math.floor(s/60),r=s-m*60;return (m?m+':'+(r<10?'0':''):'')+r.toFixed(2);}
function best(ev){var l=D.filter(function(x){return x.who===who&&x.ev===ev;});if(!l.length)return null;return l.reduce(function(a,b){return b.s<a.s?b:a;});}
function draw(){var mineL=D.filter(function(x){return x.who===who;}),evs=[];mineL.forEach(function(x){if(evs.indexOf(x.ev)<0)evs.push(x.ev);});evs.sort(function(a,b){return parseInt(a)-parseInt(b);});
  $('pb').innerHTML=evs.length?'<div class="card">'+evs.map(function(ev){var b=best(ev),n=mineL.filter(function(x){return x.ev===ev;}).length;return '<div class="row" style="padding:5px 0"><span class="grow">🏅 '+MF.esc(ev)+' <span class="muted">기록 '+n+'개</span></span><span class="big">'+fmt(b.s)+'</span></div>';}).join('')+'</div>':'<div class="empty">기록을 추가하면 종목별 최고 기록이 나와요.</div>';
  var l=mineL.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  $('list').innerHTML=l.length?l.map(function(x){var b=best(x.ev);return '<div class="card tap" data-id="'+x.id+'"><div class="row"><span class="grow"><span class="chip" style="--c:#7cc6f2">'+MF.esc(x.ev)+'</span> <span class="muted">'+MF.day(x.d,true)+'</span></span><span class="big">'+(b===x?'🏅 ':'')+fmt(x.s)+'</span></div>'+(x.where||x.memo?'<div class="muted" style="margin-top:4px">'+MF.esc([x.where,x.memo].filter(Boolean).join(' · '))+'</div>':'')+'</div>';}).join(''):'<div class="empty">아직 기록이 없어요.</div>';}
function edit(e){MF.form({title:e?'기록 고치기':'기록 추가',value:e?Object.assign({},e,{t:fmt(e.s)}):{d:MF.ymd(),ev:'500m',kind:'연습'},
  fields:[{k:'ev',label:'종목',type:'opts',opts:EV.map(function(x){return[x,x];})},{k:'t',label:'기록 (예: 58.42 또는 1:02.45)',req:true,ph:'58.42',max:10},{k:'d',label:'날짜',type:'date',req:true},{k:'kind',label:'구분',type:'opts',opts:[['연습','연습'],['대회','대회']]},{k:'where',label:'대회 이름이나 장소',max:24},{k:'memo',label:'메모',type:'textarea',max:100,ph:'잘된 점, 다음에 고칠 점'}],
  onSave:function(v){var s=sec(v.t);if(!(s>0)){MF.toast('기록을 58.42 또는 1:02.45처럼 써 주세요');setTimeout(function(){edit(e);},400);return;}
    var old=best(v.ev);delete v.t;v.s=s;if(v.kind==='대회'&&!v.where)v.where='대회';if(e)Object.assign(e,v);else{v.id=MF.uid();v.who=who;D.push(v);}save();draw();
    MF.toast(!old||s<old.s?'🏅 '+v.ev+' 최고 기록이에요!':'저장했어요');},onDelete:e?function(){D=D.filter(function(x){return x!==e;});save();draw();}:null});}
$('list').onclick=function(ev){var c=ev.target.closest('[data-id]');if(c)edit(D.filter(function(x){return x.id===c.dataset.id;})[0]);};
$('add').onclick=function(){edit(null);};
MF.who($('who'),{kids:true},function(id){who=id;draw();});
MF.live(['skate'],function(){D=MF.load('skate',[]);draw();});
})();
</script>
</body>
</html>
