<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>텐텐 양궁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 한 화면: 전체가 경기장 그림(위쪽에 과녁, 아래쪽에 활). 위에 머리줄(거리·바람·점수), 가운데 안내 말풍선, 메뉴·결과는 가운데 카드. */
:root{--ink:#22304a;--paper:#fffaf0;--line:#22304a;--accent:#ff6b57;--gold:#ffcf3f;--f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f5;color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;justify-content:center;align-items:stretch;pointer-events:none}
.chip{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:3px 9px;text-align:center;min-width:56px;box-shadow:0 3px 0 var(--line)}
.chip b{display:block;font-family:var(--f-disp);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap}
.chip span{font-size:10.5px;font-weight:700;opacity:.7;white-space:nowrap}
#btnQuit{pointer-events:auto;font-family:var(--f-disp);font-size:16px;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:0 11px;box-shadow:0 3px 0 var(--line)}
#arrows{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center;pointer-events:none}
#arrows i{font-style:normal;font-family:var(--f-disp);font-size:15px;min-width:34px;text-align:center;background:var(--paper);border:2.5px solid var(--line);border-radius:10px;padding:2px 4px}
#arrows i.now{background:var(--gold)}#arrows i.todo{opacity:.55}
#tip{position:fixed;left:50%;top:52%;transform:translateX(-50%);max-width:calc(100% - 28px);font-family:var(--f-disp);font-size:18px;text-align:center;background:rgba(255,250,240,.94);border:3px solid var(--line);border-radius:16px;padding:7px 14px;pointer-events:none;opacity:0;transition:opacity .25s}
#tip.show{opacity:1}
#pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:52px;color:#fffaf0;-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:0 4px 0 var(--line);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:5}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));background:rgba(34,48,74,.45)}
.card{position:relative;width:100%;max-width:410px;max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:0 7px 0 var(--line);padding:15px;text-align:center}
.card h1{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1.05;margin:2px 0 2px}.card h1 b{font-weight:400;color:var(--accent)}
.card h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 6px}
.card p{margin:5px 0;font-size:13.5px;line-height:1.5}
.kicker{font-size:11px;font-weight:700;letter-spacing:.18em;opacity:.65;margin:0}
.big{display:block;width:100%;margin:8px 0 0;padding:11px;font-family:var(--f-disp);font-size:19px;background:var(--gold);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.big.go{background:var(--accent);color:#fffaf0}.big.gh{background:#fff;box-shadow:none;border-width:2px;font-size:15px;padding:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#stages{display:grid;gap:7px;margin:9px 0 2px}
#stages button{display:flex;align-items:center;gap:9px;text-align:left;padding:7px 10px;background:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
#stages button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#stages button.lock{opacity:.5;border-style:dashed;box-shadow:none}
#stages .d{flex:none;font-family:var(--f-disp);font-size:19px;min-width:52px;text-align:center;background:#dff2ff;border:2px solid var(--line);border-radius:10px;padding:1px 4px}
#stages .n{flex:1;min-width:0;font-family:var(--f-disp);font-size:16px;line-height:1.15}#stages .n small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;opacity:.75}
#stages .m{flex:none;font-size:20px}
.stat{display:flex;gap:6px;margin:8px 0}.stat div{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 4px;font-size:11px;font-weight:700}.stat b{display:block;font-family:var(--f-disp);font-weight:400;font-size:20px}
#bows{display:grid;gap:7px;margin:8px 0}#bows button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:8px 10px;background:#fff;border:3px solid var(--line);border-radius:14px}
#bows button[aria-pressed=true]{background:#dff7e6}#bows b{font-family:var(--f-disp);font-weight:400;font-size:17px;display:block}#bows small{font-size:11.5px;opacity:.75}
.fact{background:#e7f6ff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;text-align:left;margin-top:8px}
#btnHub{position:absolute;left:12px;top:12px;font-family:var(--f-disp);font-size:13px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;z-index:3}
[hidden]{display:none!important}
body.cine #hud,body.cine #arrows,body.cine #tip{display:none}
</style>

<canvas id="game" aria-label="양궁 경기장"></canvas>
<div id="hud" hidden>
  <div class="chip"><span id="hName">연습장</span><b id="hDist">20m</b></div>
  <div class="chip"><span>바람</span><b id="hWind">없음</b></div>
  <div class="chip"><span>점수</span><b id="hScore">0</b></div>
  <button id="btnQuit" aria-label="그만하기">✕</button>
</div>
<div id="arrows" hidden></div>
<div id="tip"></div>
<div id="pop"></div>

<section id="menu" class="sheet">
  <div class="card">
    <button id="btnHub" hidden>← 게임 목록</button>
    <p class="kicker">TEN TEN ARCHERY</p>
    <h1>텐텐 <b>양궁</b></h1>
    <p>화면을 누른 채 끌어서 겨누고, 손을 떼면 쏴요. 화살 6발로 겨뤄요.</p>
    <div id="stages"></div>
    <div class="row2"><button class="big" id="bMode"></button><button class="big" id="bShop">🏹 활 고르기</button></div>
    <button class="big gh" id="bSound"></button>
  </div>
</section>
<section id="shop" class="sheet" hidden>
  <div class="card"><h2>🏹 활 고르기</h2><p>내 포인트 <b id="sPts">0</b>P · 좋은 활일수록 조준이 덜 흔들려요.</p><div id="bows"></div><button class="big" id="sBack">돌아가기</button></div>
</section>
<section id="result" class="sheet" hidden>
  <div class="card"><h2 id="rTitle"></h2>
    <div class="stat"><div>합계<b id="rSum">0</b></div><div>10점<b id="rTen">0</b></div><div>받은 포인트<b id="rPts">0</b></div></div>
    <p id="rShots"></p><p id="rCoach"></p><div class="fact" id="rFact"></div>
    <button class="big go" id="rNext"></button><div class="row2"><button class="big" id="rAgain">다시 쏘기</button><button class="big" id="rMenu">처음으로</button></div></div>
</section>

<script src="./ticket.js"></script>
<script src="./fx.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d'),TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
/* ---------- 모든 상태는 여기서 선언 ---------- */
const KEY='tenArchery_v1',SHOTS=6,TR=61; /* TR: 과녁 반지름 61cm (지름 122cm) */
let DPR=1,VW=360,VH=640,state='menu',stage=null,si=0,shots=[],aim={x:0,y:0},drag=null,holdT=0,zoom=0,T=0,wind={x:0,y:0},fly=null,AC=null,tipT=0,popT=0,autoShoot=false,restT=0,keyAim={x:0,y:0},swayPh=0,chips=[],hitFx=null,shakeT=0,cheerT=0,conf=[],cn=null,cOn=false;
const STAGES=[
 {id:'p20',name:'연습장',dist:20,k:1.3,wind:0,desc:'바람 없음 · 가까워서 과녁이 커요'},
 {id:'m30',name:'30m 경기',dist:30,k:1,wind:1,desc:'약한 바람'},
 {id:'m50',name:'50m 경기',dist:50,k:.72,wind:2,desc:'바람을 보고 겨눠요'},
 {id:'m70',name:'70m 올림픽 거리',dist:70,k:.55,wind:2.5,desc:'올림픽과 같은 거리'},
 {id:'f70',name:'70m 결승',dist:70,k:.55,wind:4,gust:true,desc:'바람이 세고 자꾸 바뀌어요'}];
const BOWS=[{id:'basic',name:'연습용 활',p:0,sway:1,desc:'처음 쓰는 활'},{id:'carbon',name:'카본 활',p:400,sway:.75,desc:'흔들림 25% 줄어요'},{id:'pro',name:'대회용 활',p:1200,sway:.55,desc:'흔들림 45% 줄어요'}];
const FACTS=['올림픽 양궁은 70m 떨어진 곳에서 지름 122cm 과녁을 쏴요.','가장 안쪽 10점 원은 지름이 12.2cm예요. 사과 한 개쯤이에요.','과녁은 바깥부터 흰색·검정·파랑·빨강·노랑이고, 색마다 두 칸씩이에요.','바람이 불면 화살이 밀려요. 그래서 선수들은 바람이 불어오는 쪽을 겨눠요.','활을 오래 당기고 있으면 팔이 떨려요. 겨눴으면 숨을 멈추고 바로 놓아요.','선수들은 매번 똑같은 자세로 쏘는 연습을 해요. 자세가 같아야 화살이 같은 곳에 모여요.'];
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}return Object.assign({pts:0,best:{},bows:['basic'],bow:'basic',easy:true,sound:true},s||{});}
let SAVE=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
const bow=()=>BOWS.find(b=>b.id===SAVE.bow)||BOWS[0];
const medalOf=s=>s>=54?'🥇':s>=48?'🥈':s>=40?'🥉':'';
const unlocked=i=>i===0||(SAVE.best[STAGES[i-1].id]|0)>=40;
/* ---------- 소리 ---------- */
function zzOn(){return !!((SAVE.sound)&&window.MongFx);}
function zz(n,k){return zzOn()&&MongFx.sfx(n,k);}
function cf(k){if(window.MongFx)MongFx.confetti(k);}
function audio(){if(!SAVE.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}return AC;}
function beep(f,d,type,vol,slide){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.setValueAtTime(vol||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
function thunk(){beep(160,.12,'square',.14,70);}
/* ---------- 화면 ---------- */
function layout(){DPR=Math.min(2,window.devicePixelRatio||1);VW=Math.max(200,innerWidth);VH=Math.max(300,innerHeight);cv.width=VW*DPR;cv.height=VH*DPR;}
addEventListener('resize',layout);
const tgt=()=>({x:VW/2,y:VH*.31});
function baseR(){return clamp(Math.min(VW*.2,VH*.12),40,120)*(stage?stage.k:1);}
function curR(){const zr=clamp(Math.min(VW*.4,VH*.24),90,230);return baseR()+(zr-baseR())*zoom;}
/* 흔들림(cm): 멀수록, 오래 당길수록 커져요 */
function sway(){if(!stage)return{x:0,y:0};const a=(2+stage.dist*.1)*bow().sway*(SAVE.easy?.7:1)*(1+clamp(holdT-2.5,0,4)*.45);return{x:Math.sin(swayPh*1.3)*a+Math.sin(swayPh*2.9)*a*.35,y:Math.cos(swayPh*1.7)*a*.8+Math.sin(swayPh*3.7)*a*.3};}
function drift(){const d=stage.dist;return{x:wind.x*d*.11*(d/70),y:wind.y*d*.11*(d/70)};}
function ringScore(x,y){const r=Math.hypot(x,y);if(r>TR)return 0;return Math.max(1,10-Math.floor(r/(TR/10)));}
/* ---------- 흐름 ---------- */
function setWind(){const w=stage.wind;if(!w){wind={x:0,y:0};}else{const s=rnd(w*.5,w)*(Math.random()<.5?-1:1);wind={x:s,y:rnd(-.25,.25)*w};}
  $('hWind').textContent=w?((wind.x>0?'→ ':'← ')+Math.abs(wind.x).toFixed(1)+'m/s'):'없음';}
function newAim(){const a=rnd(0,TAU),r=rnd(22,38);aim={x:Math.cos(a)*r,y:Math.sin(a)*r};keyAim={x:0,y:0};}
function startStage(i){if(window.MongGate&&!autoShoot&&!MongGate.pass){MongGate.play(()=>{MongGate.pass=1;try{startStage(i);}finally{MongGate.pass=0;}});return;}
  si=i;stage=STAGES[i];shots=[];fly=null;drag=null;zoom=0;holdT=0;state='aim';audio();setWind();newAim();show(null);hud();tip(stage.wind?'바람을 보고, 불어오는 쪽을 겨눠요':'누른 채 끌어서 겨누고, 떼면 쏴요',3200);}
function shoot(){if(state!=='aim'||fly)return;if(holdT<.45&&!autoShoot){tip('활을 조금 더 당겨요',1200);return;}
  const s=sway(),d=drift(),sp=stage.dist*.016,hit={x:aim.x+s.x+d.x+rnd(-sp,sp)+rnd(-sp,sp),y:aim.y+s.y+d.y+rnd(-sp,sp)+rnd(-sp,sp)};
  fly={t:0,dur:.45+stage.dist*.008,hit:hit};if(ringScore(hit.x,hit.y)===10){fly.cine=true;fly.dur=CN_A+CN_B;}state='fly';(zz('shoot')||beep(700,.18,'sawtooth',.08,180));}
function land(){const h=fly.hit,sc=ringScore(h.x,h.y),inner=Math.hypot(h.x,h.y)<=TR/20;shots.push({x:h.x,y:h.y,s:sc,inner:inner,t0:T});if(fly.cine){cn={t:0,hit:h,ch:[]};for(let k=0;k<28;k++)cn.ch.push({vx:rnd(-1.6,1.6),vy:rnd(.2,2.8),vz:rnd(-3,-.4),l:rnd(.5,1),c:['#ffd23f','#fff3b0','#ff6b57','#e9d9a6'][k%4]});}fly=null;thunk();if(sc>=9){cheerT=1.4;if(sc===10)for(let k=0;k<34;k++)conf.push({x:rnd(0,VW),y:rnd(-60,-10),vx:rnd(-30,30),vy:rnd(120,260),t:rnd(1.2,2.2),c:['#ff6b57','#ffcf3f','#35c9a3','#3d8fe0','#ffffff'][k%5],a:rnd(0,6)});}
  if(sc){shakeT=.22;hitFx={x:h.x,y:h.y,t:0,gold:sc>=9};for(let k=0;k<(sc>=9?16:9);k++)chips.push({x:h.x,y:h.y,vx:rnd(-90,90),vy:rnd(-120,30),t:rnd(.35,.7),c:sc>=9?['#ffd23f','#fff3b0','#ff6b57'][k%3]:['#e9d9a6','#c9a26b','#ffffff'][k%3]});}
  pop(sc===10?(inner?'엑스텐!':'텐!'):sc?sc+'점':'빗나갔어요',sc>=9);if(cn)popT=CN_HOLD-.15;if(sc>=9)setTimeout(()=>(zz('bull')||beep(1175,.2)),90);hud();
  if(shots.length>=SHOTS){state='wait';setTimeout(finish,cn?1300+CN_HOLD*1000:1300);return;}
  if(stage.gust||shots.length===3)setWind();restT=.9;state='rest';if(shots.length===3)tip('절반 왔어요! 화살이 모인 곳을 보고 고쳐 겨눠요',2600);}
function finish(){const sum=shots.reduce((a,s)=>a+s.s,0),tens=shots.filter(s=>s.s===10).length,pts=Math.round(sum*(1+si*.5))+(tens*10);
  const old=SAVE.best[stage.id]|0,first40=old<40&&sum>=40;if(sum>old)SAVE.best[stage.id]=sum;SAVE.pts+=pts;save();state='result';
  const md=medalOf(sum);$('rTitle').textContent=(md?md+' ':'')+stage.name+' · '+sum+'점';$('rSum').textContent=sum+' / 60';$('rTen').textContent=tens+'발';$('rPts').textContent='+'+pts+'P';
  $('rShots').textContent='화살: '+shots.map(s=>s.s).join(' · ')+(sum>old&&old?'  (내 최고 기록!)':'');
  const ax=shots.reduce((a,s)=>a+s.x,0)/SHOTS,ay=shots.reduce((a,s)=>a+s.y,0)/SHOTS,spread=Math.sqrt(shots.reduce((a,s)=>a+(s.x-ax)**2+(s.y-ay)**2,0)/SHOTS);let c='';
  if(Math.hypot(ax,ay)>9)c='화살이 '+(Math.abs(ax)>Math.abs(ay)?(ax>0?'오른쪽':'왼쪽'):(ay>0?'아래쪽':'위쪽'))+'에 모였어요. 다음엔 반대쪽을 조금 더 겨눠 봐요.';
  else if(spread>16)c='화살이 넓게 흩어졌어요. 겨눈 뒤 오래 끌지 말고 바로 놓아 봐요.';else c='화살이 가운데에 잘 모였어요. 자세가 좋아요!';
  $('rCoach').textContent='코치: '+c;$('rFact').textContent='알고 있나요? '+FACTS[Math.floor(Math.random()*FACTS.length)];
  const nx=si+1<STAGES.length&&unlocked(si+1);$('rNext').hidden=!nx;if(nx)$('rNext').textContent=(first40?'🔓 ':'')+'다음: '+STAGES[si+1].name+' →';
  if(sum>=40){cf('win');(zz('win')||beep(784,.12));setTimeout(()=>(zzOn()||beep(1047,.12)),130);setTimeout(()=>(zzOn()||beep(1319,.25)),260);}
  show('result');}
function toMenu(){state='menu';stage=null;fly=null;cn=null;drag=null;zoom=0;renderMenu();show('menu');}
function show(id){['menu','shop','result'].forEach(s=>$(s).hidden=s!==id);const play=!id;$('hud').hidden=!play;$('arrows').hidden=!play;if(!play){$('tip').className='';}}
function hud(){if(!stage)return;$('hName').textContent=stage.name;$('hDist').textContent=stage.dist+'m';$('hScore').textContent=shots.reduce((a,s)=>a+s.s,0);
  let h='';for(let i=0;i<SHOTS;i++){const s=shots[i];h+='<i class="'+(s?'':i===shots.length?'now':'todo')+'">'+(s?(s.s||'M'):'·')+'</i>';}$('arrows').innerHTML=h;}
function tip(t,ms){const e=$('tip');e.textContent=t;e.className='show';tipT=(ms||2000)/1000;}
function pop(t,good){const e=$('pop');e.textContent=t;e.style.color=good?'#ffcf3f':'#fffaf0';e.style.opacity='1';popT=.9;}
function renderMenu(){$('stages').innerHTML=STAGES.map((s,i)=>{const ok=unlocked(i),b=SAVE.best[s.id]|0;return '<button data-i="'+i+'" class="'+(ok?'':'lock')+'"><span class="d">'+s.dist+'m</span><span class="n">'+s.name+'<small>'+(ok?(b?'최고 '+b+'점 · ':'')+s.desc:'앞 경기에서 40점 넘기')+'</small></span><span class="m">'+(ok?medalOf(b):'🔒')+'</span></button>';}).join('');

function update(dt){T+=dt;if(cheerT>0)cheerT-=dt;conf=conf.filter(q=>(q.t-=dt)>0);for(const q of conf){q.x+=(q.vx+wind.x*20)*dt;q.y+=q.vy*dt;q.a+=dt*6;}if(shakeT>0)shakeT-=dt;if(hitFx){hitFx.t+=dt;if(hitFx.t>.5)hitFx=null;}chips=chips.filter(q=>(q.t-=dt)>0);for(const q of chips){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=260*dt;}swayPh+=dt*(1.9+(stage?stage.dist*.014:0));
  if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').className='';}if(popT>0){popT-=dt;if(popT<=0)$('pop').style.opacity='0';}
  if(cn){cn.t+=dt;if(cn.t>=CN_HOLD)cn=null;else return;}
  if(state==='rest'){restT-=dt;zoom+=(0-zoom)*Math.min(1,dt*5);if(restT<=0){state='aim';newAim();holdT=0;}return;}
  if(state==='aim'){const holding=!!drag||autoShoot;zoom+=((holding?1:0)-zoom)*Math.min(1,dt*6);if(holding)holdT+=dt;else holdT=Math.max(0,holdT-dt*3);
    if(keyAim.x||keyAim.y){aim.x=clamp(aim.x+keyAim.x*45*dt,-90,90);aim.y=clamp(aim.y+keyAim.y*45*dt,-90,90);}
    if(autoShoot){const d=drift(),s=sway();aim.x+=(-d.x-s.x*.6-aim.x)*Math.min(1,dt*5);aim.y+=(-d.y-s.y*.6-aim.y)*Math.min(1,dt*5);if(holdT>1.1)shoot();}}
  if(state==='fly'&&fly){fly.t+=dt;if(fly.cine&&!fly.cut&&fly.t>=CN_A){fly.cut=1;beep(110,.6,'sine',.09,60);}if(fly.t>=fly.dur)land();}}
/* ---------- 3D 텐 장면: 10점이 될 화살은 화살을 따라가다 과녁 옆에서 느리게 보여 줘요 ---------- */
const CN_A=.9,CN_B=.85,CN_S=2.2,CN_HOLD=1.5,TY=1.3,KN=.12,K={};
function kCam(px,py,pz,tx,ty,tz,F){let fx=tx-px,fy=ty-py,fz=tz-pz,l=Math.hypot(fx,fy,fz);fx/=l;fy/=l;fz/=l;let rx=fz,rz=-fx,rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;

function kV(p){const x=p[0]-K.p[0],y=p[1]-K.p[1],z=p[2]-K.p[2];return[x*K.r[0]+z*K.r[2],x*K.u[0]+y*K.u[1]+z*K.u[2],x*K.f[0]+y*K.f[1]+z*K.f[2]];}
function kS(v){return[K.cx+v[0]/v[2]*K.F,K.cy-v[1]/v[2]*K.F];}
function kClip(vs){const o=[];for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length],ia=a[2]>=KN,ib=b[2]>=KN;if(ia)o.push(a);if(ia!==ib){const t=(KN-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,KN]);}}return o;}
function kPoly(g,pts,fill,stroke,lw){const vs=kClip(pts.map(kV));if(vs.length<3)return;g.beginPath();for(let i=0;i<vs.length;i++){const q=kS(vs[i]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function kLine(g,a,b,w,col,minw){let va=kV(a),vb=kV(b);if(va[2]<KN&&vb[2]<KN)return;if(va[2]<KN){const t=(KN-va[2])/(vb[2]-va[2]);va=[va[0]+(vb[0]-va[0])*t,va[1]+(vb[1]-va[1])*t,KN];}else if(vb[2]<KN){const t=(KN-vb[2])/(va[2]-vb[2]);vb=[vb[0]+(va[0]-vb[0])*t,vb[1]+(va[1]-vb[1])*t,KN];}
