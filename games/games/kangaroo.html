<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>캥거루 점프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 한 화면: 전체가 놀이판(캔버스). 위에 거리·동전·하트 칩과 소리·멈춤 버튼. 메뉴·멈춤·결과는 가운데 카드. 화면 아무 데나 누르면 점프. */
:root{--ground:#ffe2b0;--ink:#3a2a1e;--paper:#fffaf0;--line:#3a2a1e;--accent:#ff7a3d;--ok:#3fae5a;--f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:stretch;pointer-events:none}
#hud .sp{flex:1}
.chip{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:3px 9px;text-align:center;min-width:54px;box-shadow:0 3px 0 var(--line)}
.chip b{display:block;font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.1;white-space:nowrap}
.chip span{font-size:10.5px;font-weight:700;opacity:.7}
#hearts{color:#e8483f;letter-spacing:1px}
.hb{pointer-events:auto;font-family:var(--f-disp);font-size:17px;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:0 11px;min-width:44px;box-shadow:0 3px 0 var(--line)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));background:rgba(58,42,30,.42)}
.sheet[hidden]{display:none}
.card{position:relative;width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:0 7px 0 var(--line);padding:16px;text-align:center}
.card h1{font-family:var(--f-disp);font-weight:400;font-size:38px;line-height:1.05;margin:2px 0 4px}
.card h1 b{font-weight:400;color:var(--accent)}
.card h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0 0 6px}
.card p{margin:6px 0;font-size:14px;line-height:1.5}
.kicker{font-size:11px;font-weight:700;letter-spacing:.18em;opacity:.65;margin:0}
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.how div{border:3px solid var(--line);border-radius:16px;padding:8px 6px;background:#fff}
.how b{display:block;font-family:var(--f-disp);font-weight:400;font-size:22px}
.how span{font-size:12.5px;font-weight:700;opacity:.75}
.seg{display:flex;gap:8px;margin:10px 0 4px}
.seg button{flex:1;min-width:0;padding:8px 4px;font-family:var(--f-disp);font-size:17px;background:#fff;border:3px solid var(--line);border-radius:14px}
.seg button small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.7}
.seg button[aria-pressed=true]{background:#ffd84d;box-shadow:0 3px 0 var(--line)}
.big{display:block;width:100%;margin-top:10px;padding:13px;font-family:var(--f-disp);font-size:24px;background:var(--accent);color:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big.alt{background:#fff;color:var(--ink);font-size:18px;padding:9px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat div{border:3px solid var(--line);border-radius:16px;padding:6px;background:#fff}
.stat b{display:block;font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.1}
.stat span{font-size:11.5px;font-weight:700;opacity:.7}
.rec{display:inline-block;font-family:var(--f-disp);font-size:16px;background:#ffd84d;border:3px solid var(--line);border-radius:999px;padding:3px 14px;transform:rotate(-3deg);margin-bottom:4px}
#btnHub{position:absolute;left:14px;top:14px;font-family:var(--f-disp);font-size:14px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 11px;z-index:3}
</style>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div class="chip"><b id="hDist">0m</b><span>거리</span></div>
  <div class="chip"><b id="hCoin">0</b><span>동전</span></div>
  <div class="chip"><b id="hLv">1</b><span>레벨</span></div>
  <div class="chip" id="chipSpare" hidden><b id="hSpare" style="color:#e8483f">❤</b><span>봐주기</span></div>
  <span class="sp"></span>
  <button class="hb" id="btnSound" aria-label="소리">🔊</button>
  <button class="hb" id="btnPause" aria-label="멈춤">Ⅱ</button>
</div>

<div class="sheet" id="menu">
  <div class="card">
    <button id="btnHub" hidden>← 게임 목록</button>
    <p class="kicker">OUTBACK HOP</p>
    <h1>캥거루 <b>점프</b></h1>
    <p>아기 캥거루가 호주 들판을 달려요.<br>돌과 개미집을 넘고 동전을 주머니에 모아요!</p>
    <p style="font-weight:700">한 번 부딪히면 끝! 100m마다 레벨이 올라 더 빨라져요.</p>
    <div class="how">
      <div><b>톡!</b><span>짧게 누르면 낮은 점프</span></div>
      <div><b>꾹~</b><span>길게 누르면 높은 점프</span></div>
    </div>
    <div class="seg" id="segMode">
      <button data-m="easy">쉬움<small>천천히 · 한 번 봐주기</small></button>
      <button data-m="normal">보통<small>빠르게 시작</small></button>
    </div>
    <p id="bestLine" style="font-weight:700"></p>
    <button class="big" id="btnStart">출발!</button>
  </div>
</div>

<div class="sheet" id="pause" hidden>
  <div class="card">
    <h2>잠깐 쉬어요</h2>
    <button class="big" id="btnResume">계속하기</button>
    <button class="big alt" id="btnQuit">처음 화면으로</button>
  </div>
</div>

<div class="sheet" id="over" hidden>
  <div class="card">
    <span class="rec" id="recTag" hidden>새 기록!</span>
    <h2 id="overTitle">잘했어요!</h2>
    <div class="stat">
      <div><b id="oDist">0m</b><span>달린 거리</span></div>
      <div><b id="oCoin">0</b><span>모은 동전</span></div>
    </div>
    <p id="oBest" style="font-weight:700"></p>
    <button class="big" id="btnAgain">한 번 더!</button>
    <button class="big alt" id="btnMenu">처음 화면으로</button>
  </div>
</div>

<script src="./ticket.js"></script>
<script src="./fx.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('game'),g=cv.getContext('2d'),TAU=Math.PI*2,INK='#3a2a1e',KEY='mongfam_roo_v1';
/* 점프: 누르는 동안 덜 떨어져서 높이 뜀 */
const GR=2600,JV=760,HOLD_G=.25,HOLD_MAX=.34,CUT_G=1.2,ROO_H=70;
function apexOf(hold){let y=0,v=JV,t=0,m=0;const dt=1/240;do{const boost=t<hold&&t<HOLD_MAX&&v>0;v-=(boost?GR*HOLD_G:v>0?GR*CUT_G:GR)*dt;y+=v*dt;t+=dt;if(y>m)m=y;}while(y>0);return m;}
const MOUND_H=120,BIRD_Y=Math.round(apexOf(.12)+ROO_H+8);
const MODES={easy:{v0:250,step:15,v1:520,spare:1,gap:[1.2,1.9],gmin:.85,name:'쉬움'},normal:{v0:310,step:25,v1:680,spare:0,gap:[1.0,1.6],gmin:.75,name:'보통'}};
const NEW={2:'개미집이 나와요',3:'새가 날아와요',4:'덤불이 굴러와요',6:'톡! 톡! 연속 점프',8:'새 아래 돌은 낮게!'};
const THEMES=[
 {name:'붉은 사막',top:'#7fd0ff',bot:'#ffe9b8',far:'#e9a468',mid:'#d87c44',gnd:'#cf5f2f',gd:'#a8431f',dim:0,star:0,sun:'#fff3a8'},
 {name:'유칼립투스 숲',top:'#6ec3f7',bot:'#e4f7d0',far:'#a8c984',mid:'#72ab5c',gnd:'#c98f4f',gd:'#9f6a33',dim:0,star:0,sun:'#fff3a8'},
 {name:'노을 들판',top:'#ff7f5c',bot:'#ffd88a',far:'#c2584a',mid:'#93403f',gnd:'#b04c2c',gd:'#7f3120',dim:.14,star:0,sun:'#ffcf6b'},
 {name:'별이 빛나는 밤',top:'#141a44',bot:'#42408a',far:'#2f2e68',mid:'#262458',gnd:'#6a3a48',gd:'#472434',dim:.42,star:1,sun:'#fdf6d8'}];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
THEMES.forEach(t=>{for(const k of ['top','bot','far','mid','gnd','gd','sun'])t[k]=hex(t[k]);});
let DPR=1,VW=360,VH=640,S=1,W=520,H=640,GY=470,KX=110;
let state='menu',mode='easy',M=MODES.easy,T=0,dist=0,cam=0,speed=0,coins=0,hearts=1,lv=1,spare=0,lastType='',obs=[],cns=[],items=[],parts=[],spawnD=0,itemT=0,sup=0,inv=0,slowT=0,shake=0,banner=null,nextMile=100,thI=0,thJ=0,thK=1,seen={},autoPlay=false,autoRel=0,AC=null,newRec=false,hudKey='';
const roo={y:0,vy:0,held:false,holdT:0,ground:true,ph:0,buf:0};
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}s=Object.assign({best:{},coins:0,sound:true,mode:'easy',plays:0},s||{});s.best=Object.assign({easy:0,normal:0},s.best);return s;}
let SAVE=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
mode=MODES[SAVE.mode]?SAVE.mode:'easy';
/* 소리 */
function zzOn(){return !!(SAVE.sound&&window.MongFx);}
function zz(n,k){return zzOn()&&MongFx.sfx(n,k);}
function cf(k){if(window.MongFx)MongFx.confetti(k);}
function audio(){if(!SAVE.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}return AC;}
function beep(f,d,type,vol,slide){const a=audio();if(!a)return;if(window.MongFx&&MongFx.tone){MongFx.tone(a,f,d,type,vol,slide);return;}try{const o=a.createOscillator(),k=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);k.gain.setValueAtTime(vol||.1,a.currentTime);k.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(k);k.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch(e){}}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,hash=n=>{const s=Math.sin(n*127.1+3.7)*43758.5453;return s-Math.floor(s);};
function resize(){VW=innerWidth;VH=innerHeight;DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);S=Math.max(.42,Math.min(VH/640,VW/460));W=VW/S;H=VH/S;GY=Math.round(H*.74);KX=clamp(W*.2,96,170);}
function col(k,a){const A=THEMES[thI][k],B=THEMES[thJ][k];return 'rgb'+(a!=null?'a':'')+'('+Math.round(lerp(A[0],B[0],thK))+','+Math.round(lerp(A[1],B[1],thK))+','+Math.round(lerp(A[2],B[2],thK))+(a!=null?','+a:'')+')';}
function tnum(k){return lerp(THEMES[thI][k],THEMES[thJ][k],thK);}
function say(t,sec,sub){banner={t,sub,life:sec||1.6,max:sec||1.6};}

/* ───── 놀이 ───── */
function reset(){M=MODES[mode];T=0;dist=0;cam=0;coins=0;hearts=1;lv=1;spare=M.spare;lastType='';obs=[];cns=[];items=[];parts=[];spawnD=M.v0*1.7;itemT=rnd(14,20);sup=0;inv=0;slowT=0;shake=0;nextMile=100;thI=thJ=0;thK=1;seen={};newRec=false;
  Object.assign(roo,{y:0,vy:0,held:false,holdT:0,ground:true,ph:0,buf:0});speed=M.v0;}
function startGame(){if(window.MongGate&&!autoPlay&&!MongGate.pass){MongGate.play(()=>{MongGate.pass=1;try{startGame();}finally{MongGate.pass=0;}});return;}
  reset();state='play';SAVE.plays++;SAVE.mode=mode;save();show();say('출발!',1.2);zz('pop');}
function press(){if(state!=='play')return;roo.held=true;if(roo.ground)jump();else roo.buf=.13;}
function release(){roo.held=false;}
function jump(){roo.vy=JV;roo.ground=false;roo.holdT=0;roo.buf=0;beep(420,.1,'sine',.07,760);dust(KX-8,0,4);}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x,y:y+2,vx:rnd(-90,-10),vy:rnd(20,110),life:.4,max:.4,c:'#f4d7a8',r:rnd(3,6)});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(80,300);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+120,life:.6,max:.6,c,r:rnd(3,7),gr:1});}}
function mk(type,x){const o={type,x,y:0,w:46,h:44,vx:0,seed:Math.random()};
  if(type==='bush'){o.w=62;o.h=38;}else if(type==='log'){o.w=84;o.h=40;}else if(type==='rock2'){o.w=94;o.h=44;}else if(type==='roll'){o.w=44;o.h=42;o.vx=110;}else if(type==='mound'){o.w=44;o.h=MOUND_H;}else if(type==='bird'){o.w=56;o.h=30;o.y=BIRD_Y;o.vx=Math.min(150,30+lv*6);}
  obs.push(o);return o;}
function hintOf(key,o,txt){seen[key]=(seen[key]||0)+1;if(seen[key]<=2)o.hint=txt;}
function arc(cx,top,side,dx){cns.push({x:cx-dx,y:side},{x:cx,y:top},{x:cx+dx,y:side});}
function spawn(){const pool=['rock','rock','bush','bush'];if(dist>60)pool.push('log','log');if(lv>=2)pool.push('mound','mound');if(lv>=3)pool.push('bird','bird','rock2');if(lv>=4)pool.push('roll','roll');if(lv>=6)pool.push('double','double','mound');if(lv>=8)pool.push('birdrock','birdrock','bird');if(lv>=11)pool.push('double','birdrock','roll','mound');if(lv>=15)pool.splice(0,3);
  let type=pool[Math.floor(Math.random()*pool.length)];if(lastType===type&&type!=='rock'&&type!=='bush'&&type!=='log')type='rock';lastType=type;
  const X=W+70;let o,end,extra=0;
  if(type==='double'){o=mk(Math.random()<.5?'rock':'bush',X);const o2=mk(Math.random()<.5?'rock':'bush',X+speed*.72);hintOf('double',o,'톡! 톡!');end=o2.x+o2.w;extra=.15;cns.push({x:o.x+o.w/2,y:120},{x:o2.x+o2.w/2,y:120});}
  else if(type==='birdrock'){o=mk('rock',X);const b=mk('bird',X-5);b.vx=0;hintOf('birdrock',o,'낮게 톡!');end=o.x+o.w;}
  else if(type==='roll'){o=mk('roll',X);o.x=KX+(X-KX)*(speed+o.vx)/speed;hintOf('roll',o,'굴러와요!');end=X+o.w;}
  else{o=mk(type,X);hintOf(type,o,type==='mound'?'꾹~ 길게!':type==='bird'?'낮게 톡!':'톡!');end=o.x+o.w;if(type==='mound')extra=.2;
    const cx=o.x+o.w/2;if(type==='bird'){for(let i=0;i<4;i++)cns.push({x:cx-60+i*40,y:26});}
    else if(Math.random()<.65){if(type==='mound')arc(cx,205,172,58);else arc(cx,124,96,48+o.w*.25);}}
  const gt=rnd(M.gap[0],M.gap[1])*Math.max(M.gmin,1-.02*(lv-1))+extra,gap=speed*gt;spawnD=(end-X)+gap;
  const mid=end+gap*.55;
  if(itemT<=0&&gap>300){items.push({x:mid,y:118,type:'star'});itemT=rnd(22,32);}
  else if(gap>330&&Math.random()<.5){const n=3+(Math.random()<.5?1:0);for(let i=0;i<n;i++)cns.push({x:mid+(i-(n-1)/2)*40,y:26});}}
function hurt(o){shake=.35;if(spare>0){spare--;inv=1.6;slowT=.5;say('한 번 봐줄게!',1.3);zz('hit')||beep(160,.25,'sawtooth',.2,60);burst(KX+10,roo.y+40,'#ff7a3d',10);return;}hearts=0;zz('hit')||beep(160,.25,'sawtooth',.2,60);burst(KX+10,roo.y+40,'#ff7a3d',10);if(hearts<=0)gameOver();}
function gameOver(){state='over';const d=Math.floor(dist);newRec=d>SAVE.best[mode];if(newRec)SAVE.best[mode]=d;SAVE.coins+=coins;save();
  $('oDist').textContent=d+'m';$('oCoin').textContent=coins;$('recTag').hidden=!newRec;$('overTitle').textContent=newRec?'우와, 최고 기록!':d>=300?'멀리 왔어요!':'잘했어요!';
  $('oBest').textContent='레벨 '+lv+' 도달 · '+M.name+' 최고 기록 '+SAVE.best[mode]+'m';show();if(newRec&&d>0){zz('win');cf('win');}else zz('lose');}
function auto(){if(roo.held&&T>=autoRel)release();if(!roo.ground)return;let o=null;for(const q of obs)if(q.type!=='bird'&&q.x+q.w>KX-16){o=q;break;}
  if(!o)return;const rs=speed+o.vx,d=o.x-(KX+18),lead=o.type==='mound'?rs*.2+8:rs*.1+6;if(d<=lead){press();autoRel=T+(o.type==='mound'?.4:(o.type==='log'||o.type==='rock2')?.16:.06);}}
function update(dt){T+=dt;
  if(state!=='play'){roo.ph+=dt*9;cam+=120*dt;for(const p of parts)p.life-=dt;parts=parts.filter(p=>p.life>0);return;}
  if(autoPlay)auto();
  speed=Math.min(M.v1,M.v0+M.step*(lv-1))*(sup>0?1.35:1)*(slowT>0?.55:1);
  const dx=speed*dt;dist+=dx/50;cam+=dx;
  sup=Math.max(0,sup-dt);inv=Math.max(0,inv-dt);slowT=Math.max(0,slowT-dt);shake=Math.max(0,shake-dt);itemT-=dt;
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
  /* 캥거루 */
  if(roo.buf>0){roo.buf-=dt;if(roo.ground)jump();}
  if(!roo.ground){roo.holdT+=dt;const boost=roo.held&&roo.holdT<HOLD_MAX&&roo.vy>0;roo.vy-=(boost?GR*HOLD_G:roo.vy>0?GR*CUT_G:GR)*dt;roo.y+=roo.vy*dt;
    if(roo.y<=0){roo.y=0;roo.vy=0;roo.ground=true;dust(KX-6,0,5);beep(150,.05,'sine',.05);}}
  else roo.ph+=dt*(8+speed/90);
  /* 흐르기 */
  for(const o of obs)o.x-=dx+o.vx*dt;for(const c of cns)c.x-=dx;for(const it of items)it.x-=dx;
  obs=obs.filter(o=>o.x+o.w>-80&&!o.dead);cns=cns.filter(c=>c.x>-40&&!c.got);items=items.filter(it=>it.x>-40&&!it.got);
  spawnD-=dx;if(spawnD<=0)spawn();
  /* 부딪힘 */
  const rx0=KX-16,rx1=KX+18,ry0=roo.y,ry1=roo.y+ROO_H-8;
  for(const o of obs){if(o.hit)continue;if(rx1>o.x+5&&rx0<o.x+o.w-5&&ry1>o.y&&ry0<o.y+o.h-6){

  const P3=130;for(let k=Math.floor(cam/P3)-1;k*P3-cam<W+P3;k++){const x=k*P3-cam+hash(k)*70,y=GY+26+hash(k+4)*(H-GY-50);g.beginPath();g.ellipse(x,y,10+hash(k+8)*16,4,0,0,TAU);g.fill();}
  {const gq=g.createLinearGradient(0,GY,0,H);gq.addColorStop(0,'rgba(255,255,255,.08)');gq.addColorStop(.25,'rgba(0,0,0,0)');gq.addColorStop(1,'rgba(60,20,10,.28)');g.fillStyle=gq;g.fillRect(-10,GY,W+20,H-GY+20);
    const P5=95;for(let k=Math.floor(cam/P5)-1;k*P5-cam<W+P5;k++){const x=k*P5-cam+hash(k+40)*60,y=GY+18+hash(k+41)*(H-GY-40),r=3+hash(k+42)*5,ty=hash(k+43);
      if(ty<.4){g.fillStyle='rgba(255,235,210,.35)';g.beginPath();g.ellipse(x,y,r*1.3,r*.7,0,0,TAU);g.fill();g.fillStyle='rgba(60,20,10,.2)';g.beginPath();g.ellipse(x+1,y+r*.5,r*1.3,r*.3,0,0,TAU);g.fill();}
      else if(ty<.7){g.strokeStyle='rgba(60,20,10,.22)';g.lineWidth=1.5;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+r*2,y+r*.6);g.lineTo(x+r*3.4,y-r*.2);g.stroke();}
      else{g.lineCap='round';g.lineWidth=2.2;for(let b=-2;b<=2;b++){g.strokeStyle=b%2?'rgba(185,180,85,.85)':'rgba(147,166,70,.85)';g.beginPath();g.moveTo(x+b*2.5,y+2);g.quadraticCurveTo(x+b*4,y-4,x+b*6,y-7-r*.6);g.stroke();}}}}
  g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(-10,GY);g.lineTo(W+10,GY);g.stroke();
  if(state==='play'&&dist<28){g.globalAlpha=clamp((28-dist)/8,0,1)*.9;g.fillStyle='#fffaf0';g.font='400 24px Jua,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('톡 = 낮게   ·   꾹 = 높이',W/2,GY+(H-GY)*.5);g.globalAlpha=1;}
  /* 그림자 */
  const sh=clamp(1-roo.y/300,.35,1);g.fillStyle='rgba(58,42,30,.25)';g.beginPath();g.ellipse(KX,GY+6,30*sh,7*sh,0,0,TAU);g.fill();
  /* 동전·아이템 */
  for(const c of cns){const sxx=Math.abs(Math.cos(T*5+c.x*.02));g.fillStyle='#ffd23f';g.strokeStyle=INK;g.lineWidth=2.5;g.beginPath();g.ellipse(c.x,GY-c.y,11*Math.max(.25,sxx),11,0,0,TAU);g.fill();g.stroke();if(sxx>.5){g.strokeStyle='#e8a200';g.lineWidth=2;g.beginPath();g.ellipse(c.x,GY-c.y,6*sxx,6,0,0,TAU);g.stroke();g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(c.x-3*sxx,GY-c.y-4,2.2*sxx,1.4,-.5,0,TAU);g.fill();}}
  for(const it of items){const y=GY-it.y+Math.sin(T*5)*5;g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';
    if(it.type==='star'){g.fillStyle='rgba(255,230,107,.4)';g.beginPath();g.arc(it.x,y,26+Math.sin(T*8)*3,0,TAU);g.fill();g.fillStyle='#ffd84d';star5(it.x,y,19,8.5);g.fill();g.stroke();}
    else{g.fillStyle='#ff5a6e';g.beginPath();g.moveTo(it.x,y+15);g.bezierCurveTo(it.x-26,y-4,it.x-12,y-22,it.x,y-8);g.bezierCurveTo(it.x+12,y-22,it.x+26,y-4,it.x,y+15);g.closePath();g.fill();g.stroke();}}
  for(const o of obs){const r2=o.type==='rock2';g.fillStyle='rgba(58,42,30,'+(o.y>0?.12:.22)+')';g.beginPath();g.ellipse(o.x+(r2?47:o.w/2),GY+5,(r2?54:o.w*.58)*(o.y>0?.6:1),6,0,0,TAU);g.fill();}
  for(const o of obs)drawObs(o);
  if(!(inv>0&&sup<=0&&Math.floor(T*12)%2))drawRoo(KX,GY-roo.y,{air:!roo.ground,vy:roo.vy,ph:roo.ph,sup:sup>0,ouch:inv>.9&&sup<=0,coin:coins>0});
  for(const p of parts){g.globalAlpha=clamp(p.life/p.max,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,GY-p.y,p.r,0,TAU);g.fill();}g.globalAlpha=1;
  {const P7=210,fo2=cam*1.7;g.fillStyle='rgba(40,25,15,.3)';for(let k=Math.floor(fo2/P7)-1;k*P7-fo2<W+P7;k++){if(hash(k+80)<.4)continue;const x=k*P7-fo2+hash(k+81)*100;for(let b=-3;b<=3;b++){const hh=26+hash(k+b+82)*30;g.beginPath();g.moveTo(x+b*7-4,H+4);g.quadraticCurveTo(x+b*10,H-hh*.6,x+b*14,H-hh);g.quadraticCurveTo(x+b*10+4,H-hh*.5,x+b*7+5,H+4);g.closePath();g.fill();}}
    const lq=g.createRadialGradient(W*.8,GY*.2,0,W*.8,GY*.2,Math.hypot(W,H)*.9);lq.addColorStop(0,col('sun',.14));lq.addColorStop(1,col('sun',0));g.fillStyle=lq;g.fillRect(-10,-10,W+20,H+20);}
  if(sup>0&&state==='play'){const bw=Math.min(220,W*.5);g.fillStyle='#fffaf0';rr(W/2-bw/2,GY+18,bw,16,8);g.fill();g.strokeStyle=INK;g.lineWidth=3;g.stroke();g.fillStyle='#ffd84d';rr(W/2-bw/2+3,GY+21,Math.max(6,(bw-6)*sup/5),10,5);g.fill();}
  if(banner&&state==='play'){const a=clamp(banner.life/.3,0,1),pop=1+.25*clamp(1-(banner.max-banner.life)/.18,0,1);g.save();g.translate(W/2,H*.27);g.scale(pop,pop);g.globalAlpha=a;g.font='400 46px Jua,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=9;g.strokeStyle=INK;g.strokeText(banner.t,0,0);g.fillStyle='#fffaf0';g.fillText(banner.t,0,0);if(banner.sub){g.font='400 25px Jua,sans-serif';g.lineWidth=7;g.strokeText(banner.sub,0,44);g.fillStyle='#ffd84d';g.fillText(banner.sub,0,44);}g.restore();}
  hud();}
function hud(){const k=Math.floor(dist)+'|'+coins+'|'+lv+'|'+spare+'|'+state+mode;if(k===hudKey)return;hudKey=k;$('hDist').textContent=Math.floor(dist)+'m';$('hCoin').textContent=coins;$('hLv').textContent=lv;$('chipSpare').hidden=!M.spare;$('hSpare').textContent=spare>0?'❤':'♡';}

/* ───── 화면 ───── */
function show(){$('menu').hidden=state!=='menu';$('pause').hidden=state!=='pause';$('over').hidden=state!=='over';$('hud').hidden=state==='menu';if(state==='menu')renderMenu();}
function renderMenu(){for(const b of $('segMode').children)b.setAttribute('aria-pressed',b.dataset.m===mode);const b=SAVE.best[mode];$('bestLine').textContent=b>0?MODES[mode].name+' 최고 기록 '+b+'m · 모은 동전 '+SAVE.coins+'개':'첫 기록에 도전해 봐요!';$('btnSound').textContent=SAVE.sound?'🔊':'🔇';}
$('segMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;M=MODES[mode];SAVE.mode=mode;save();zz('tick');renderMenu();};
$('btnStart').onclick=startGame;$('btnAgain').onclick=startGame;
$('btnMenu').onclick=$('btnQuit').onclick=()=>{state='menu';reset();show();};
$('btnPause').onclick=()=>{if(state==='play'){state='pause';release();show();}};
$('btnResume').onclick=()=>{if(state==='pause'){state='play';show();}};
$('btnSound').onclick=()=>{SAVE.sound=!SAVE.sound;save();$('btnSound').textContent=SAVE.sound?'🔊':'🔇';if(SAVE.sound)zz('tick');};
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});

addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(state==='play')press();else if(state==='menu'&&!document.getElementById('mgRoot'))startGame();}else if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')$('btnPause').onclick();else if(state==='pause')$('btnResume').onclick();}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';release();show();}});
addEventListener('resize',resize);addEventListener('contextmenu',e=>e.preventDefault());
if(/\/games\//.test(location.pathname)){$('btnHub').hidden=false;document.querySelector('#menu .kicker').style.marginTop='32px';$('btnHub').onclick=()=>{if(history.length>1)history.back();else location.href='../index.html';};}
