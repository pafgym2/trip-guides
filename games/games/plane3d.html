<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>꼬마 조종사 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen canvas (map / side-view takeoff+landing / behind-view cruise); big rounded kid-size buttons; one centred sheet for result and hangar */
:root{--ink:#0e2a47;--sheet:#fffdf6;--text:#17324d;--muted:#6b7f93;--sky:#58b7f5;--sun:#ffc93c;--red:#ff5a5f;--green:#2fc27a;--line:rgba(23,50,77,.15);
  --f-disp:"Jua","Apple SD Gothic Neo",system-ui,sans-serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#58b7f5;color:var(--text);overflow:hidden;font-family:var(--f-body)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pill{background:rgba(255,255,255,.92);border:0;border-radius:999px;padding:8px 14px;font-family:var(--f-disp);font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
/* map */
#map{position:fixed;inset:0}
.topbar{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 max(10px,env(safe-area-inset-left,0px))}
.title{position:absolute;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));text-align:center;font-family:var(--f-disp);font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(14,42,71,.35);pointer-events:none}
.title small{display:block;font-size:14px;font-family:var(--f-body);font-weight:600;opacity:.95;text-shadow:0 1px 0 rgba(14,42,71,.4)}
.stage{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;padding:8px 10px;border-radius:18px;border:3px solid #fff;background:var(--sun);font-family:var(--f-disp);font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.stage .em{font-size:26px;line-height:1.1}
.stage .st{font-size:13px;letter-spacing:1px;color:#b0721a}
.stage.lock{background:#c9d6e2;color:#6b7f93}
#btnPage{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:17px;padding:10px 16px;background:#fff;border:3px solid #ffc93c;z-index:2}
.stage.home{background:#fff;pointer-events:none;min-width:0;padding:5px 10px;font-size:14px}
.stage:not(.lock):not(.home):active{transform:translate(-50%,-46%);box-shadow:0 1px 0 rgba(0,0,0,.18)}
#mode[aria-pressed="true"]{background:var(--red);color:#fff}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-disp)}
.hud-t{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 max(10px,env(safe-area-inset-left,0px))}
.hud-t .pill{font-size:17px}
#btnQuit{pointer-events:auto}
#prog{flex:1;max-width:340px;height:30px;border-radius:999px;background:rgba(255,255,255,.9);position:relative;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:13px}
#prog i{position:absolute;left:4px;top:4px;bottom:4px;border-radius:999px;background:var(--green);width:0}
#prog b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;left:6%}
#prog span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:400}
#tip{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(14,42,71,.82);color:#fff;border-radius:16px;padding:9px 16px;font-size:18px;text-align:center;max-width:calc(100vw - 30px);opacity:0;transition:opacity .25s;line-height:1.3}
#tip.show{opacity:1}
#tip.big{font-size:30px;background:var(--red)}
#tip.good{font-size:26px;background:var(--green)}
/* sheets */
.sheet{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow:auto;touch-action:pan-y;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(14,42,71,.55)}
.card{width:100%;max-width:420px;background:var(--sheet);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center}
h2{font-family:var(--f-disp);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.bigstars{font-size:50px;letter-spacing:6px;color:var(--sun);line-height:1;text-shadow:0 3px 0 #d39a12}
.bigstars i{font-style:normal;color:#dbe3ea;text-shadow:none}
.rows{display:flex;flex-direction:column;gap:6px;text-align:left}
.rows div{display:flex;justify-content:space-between;gap:8px;background:#f1f5f8;border-radius:12px;padding:8px 12px;font-size:15px}
.rows b{font-family:var(--f-disp);font-weight:400;font-size:16px}
.fact{background:#e7f6ff;border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5;text-align:left}
.fact b{font-family:var(--f-disp);font-weight:400;font-size:17px}
.go{height:54px;border-radius:16px;border:0;background:var(--green);color:#fff;font-family:var(--f-disp);font-size:21px;box-shadow:0 5px 0 #1f9159}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #1f9159}
.ghost{height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:var(--f-disp);font-size:17px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;border:2.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;min-width:0}
.sw canvas{width:100%;height:46px}
.sw .dot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{border-color:var(--green);background:#eafaf1}
.sw .pr{font-family:var(--f-disp);font-weight:400;color:#b0721a;font-size:13px}
h3{margin:2px 0 -4px;font-family:var(--f-disp);font-weight:400;font-size:17px;text-align:left;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-family:var(--f-disp);font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.show{opacity:1}
#btnRoll{pointer-events:auto;position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:#8b5cf6;color:#fff;font-family:var(--f-disp);font-size:18px;line-height:1.1;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#btnRoll:active{transform:translateY(3px)}
.popfx{position:fixed;left:50%;top:30%;transform:translate(-50%,0);font-family:var(--f-disp);font-size:32px;color:#fff;text-shadow:0 3px 0 rgba(14,42,71,.6),0 0 16px rgba(255,201,60,.9);pointer-events:none;z-index:7;animation:popup 1.1s ease-out forwards;white-space:nowrap}
@keyframes popup{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}75%{opacity:1;transform:translate(-50%,-18px)}100%{opacity:0;transform:translate(-50%,-46px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media (max-height:600px){.title{font-size:26px;top:calc(54px + env(safe-area-inset-top,0px))}.title small{display:none}.bigstars{font-size:38px}}
</style>

<canvas id="gl" hidden></canvas>
<canvas id="game" aria-label="비행 화면"></canvas>

<div id="map">
  <div class="topbar">
    <button class="pill" id="btnHub" hidden>← 게임 목록</button>
    <span class="pill">⭐ <span id="mCoins">0</span></span>
    <button class="pill" id="btnShop">✈️ 격납고</button>
    <button class="pill" id="mode" aria-pressed="false">쉬움</button>
    <button class="pill" id="btnSound" aria-label="소리">🔊</button>
  </div>
  <div class="title">꼬마 조종사 <span style="color:#ffc93c">3D</span><small>가고 싶은 곳을 눌러요</small></div>
  <div id="stages"></div>
  <button class="pill" id="btnPage">🌏 세계 여행 →</button>
</div>

<div id="hud" hidden>
  <div class="hud-t">
    <button class="pill" id="btnQuit" aria-label="지도로">🗺️</button>
    <div id="prog"><i id="progBar"></i><b id="progPlane">✈️</b><span id="progDest"></span></div>
    <span class="pill">⭐ <span id="hCoins">0</span></span>
  </div>
  <div id="tip"></div>
  <button id="btnRoll" hidden>🌀<br>빙글!</button>
</div>

<section id="result" class="sheet" hidden>
  <div class="card">
    <h2 id="rTitle">도착!</h2>
    <div class="bigstars" id="rStars"></div>
    <div class="rows" id="rRows"></div>
    <div class="fact" id="rFact"></div>
    <button class="go" id="rNext">다음 여행 →</button>
    <div class="row2"><button class="ghost" id="rAgain">다시 날기</button><button class="ghost" id="rMap">지도</button></div>
  </div>
</section>

<section id="shop" class="sheet" hidden>
  <div class="card">
    <h2>격납고 <span style="font-size:20px">⭐ <span id="sCoins">0</span></span></h2>
    <h3>비행기</h3><div class="shopgrid" id="sPlanes"></div>
    <h3>색깔</h3><div class="shopgrid" id="sColors"></div>
    <button class="go" id="sClose">닫기</button>
  </div>
</section>
<canvas id="fx"></canvas>
<div id="toast"></div>

<script src="./three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d'),fx=$('fx'),fg=fx.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
/* ---------- 모든 상태는 여기 맨 위에서 선언 (초기화 순서 오류 방지) ---------- */
let DPR=1,VW=360,VH=640,S=1,state='map',stage=null,stageIdx=0,T=0,hold=false,autoPilot=false,mapPage=0;
let apRoll=false;let pl={x:0,alt:0,v:0,vy:0,air:false,pitch:0,landed:false},stars=[],run={rings:0,ringTotal:0,star:0,takeoff:0,landing:0,zone:false,tries:0,coins:0};
let cr={px:0,py:0,tx:0,ty:0,bank:0,objs:[],z0:1,lastZ:1,endT:0,shake:0},puffs=[],tipT=0,parts=[],fxRun=false,AC=null,engOsc=null,engGain=null,mapT=0,resultAt=0,ptrDown=false,lastTap=0,bursts=[];
const keys={};

const STAGES=[
 {id:'jeju',name:'제주',em:'🍊',rings:8,km:'450km',real:'1시간 10분',fact:'한라산과 귤이 유명한 섬이에요.',pos:[.27,.36]},
 {id:'fuk',name:'후쿠오카',em:'🍜',rings:12,km:'540km',real:'1시간 20분',fact:'일본 규슈의 도시예요. 라멘이 유명해요.',pos:[.72,.33]},
 {id:'oki',name:'오키나와',em:'🐠',rings:16,km:'1,260km',real:'2시간 20분',fact:'일본 남쪽의 따뜻한 섬. 바다가 에메랄드색이에요.',pos:[.50,.55]},
 {id:'syd',name:'시드니',em:'🐨',rings:24,km:'8,300km',real:'약 10시간',fact:'호주의 큰 도시예요. 오페라하우스와 코알라가 있어요. 한국이 겨울이면 시드니는 여름!',pos:[.70,.86],long:true},
 /* 세계 여행(지도 2쪽) */
 {id:'tyo',pg:1,first:true,name:'도쿄',em:'🗼',rings:14,km:'1,160km',real:'약 2시간 20분',fact:'일본의 수도예요. 빨간 도쿄 타워가 있고, 날씨가 맑으면 후지산이 보여요.',pos:[.78,.42]},
 {id:'bkk',pg:1,name:'방콕',em:'🐘',rings:18,km:'3,700km',real:'약 5시간 40분',fact:'태국의 수도예요. 금빛 사원이 많고, 일 년 내내 여름처럼 더워요.',pos:[.22,.52]},
 {id:'sin',pg:1,name:'싱가포르',em:'🦁',rings:20,km:'4,600km',real:'약 6시간 20분',fact:'적도 바로 옆에 있는 작은 섬나라예요. 사자 몸에 물고기 꼬리를 한 머라이언이 유명해요.',pos:[.42,.70]},
 {id:'hnl',pg:1,name:'하와이',em:'🌺',rings:22,km:'7,300km',real:'약 8시간',fact:'태평양 한가운데 있는 화산섬이에요. 날짜가 바뀌는 선을 넘어서, 출발한 날보다 하루 전에 도착해요!',pos:[.76,.66],long:true,sand:true},
 {id:'par',pg:1,name:'파리',em:'🥐',rings:26,km:'8,950km',real:'약 14시간',fact:'프랑스의 수도예요. 에펠탑은 높이가 330m쯤 돼요. 한국보다 8시간 느려요.',pos:[.16,.30],long:true},
 {id:'nyc',pg:1,name:'뉴욕',em:'🗽',rings:28,km:'11,000km',real:'약 14시간',fact:'미국에서 가장 큰 도시예요. 자유의 여신상과 높은 빌딩이 많아요. 한국이 낮이면 뉴욕은 밤!',pos:[.84,.24],long:true}];
const HOME2=[.50,.18];const curHome=()=>mapPage?HOME2:HOME;
const HOME=[.40,.22];
const PLANES=[
 {id:'prop',name:'꼬마 프로펠러',p:0,len:1,wing:1,prop:1},
 {id:'sea',name:'수상비행기',p:40,len:1.05,wing:1.1,prop:1,floats:1},
 {id:'twin',name:'쌍발 여객기',p:80,len:1.35,wing:1.25,eng:2},
 {id:'jumbo',name:'점보 제트',p:150,len:1.6,wing:1.45,eng:4,hump:1},
 {id:'sonic',name:'초음속 제트',p:250,len:1.5,wing:.95,delta:1}];
const COLORS=[{id:'red',name:'빨강',c:'#ff5a5f',p:0},{id:'blue',name:'파랑',c:'#3b82f6',p:20},{id:'yellow',name:'노랑',c:'#ffc93c',p:20},{id:'green',name:'초록',c:'#2fc27a',p:20},{id:'pink',name:'분홍',c:'#ff7fb6',p:30},{id:'purple',name:'보라',c:'#8b5cf6',p:30}];

/* ---------- 저장 ---------- */
const KEY='littlePilot_v1';
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  return Object.assign({coins:0,stars:{},planes:['prop'],plane:'prop',colors:['red'],color:'red',hard:false,sound:true},s||{});}
let SAVE=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
const curPlane=()=>PLANES.find(p=>p.id===SAVE.plane)||PLANES[0], curCol=()=>(COLORS.find(c=>c.id===SAVE.color)||COLORS[0]).c;
const unlocked=i=>i===0||(STAGES[i].first?(SAVE.stars.jeju|0)>0:(SAVE.stars[STAGES[i-1].id]|0)>0);

/* ---------- 소리 ---------- */
function audio(){if(!SAVE.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}return AC;}
function beep(f,d,type,vol){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
function ding(){beep(1047,.12);setTimeout(()=>beep(1568,.2),70);}
function cheer(){const a=audio();if(!a)return;try{const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.min(1,i/(n*.1))*Math.pow(1-i/n,1.5);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=1100;f.Q.value=.6;g.gain.value=.3;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start();}catch(e){}}
function engine(on,pitch){const a=audio();if(!a){return;}try{if(!engOsc){engOsc=a.createOscillator();engOsc.type='sawtooth';const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=500;engGain=a.createGain();engGain.gain.value=0;engOsc.connect(f).connect(engGain).connect(a.destination);engOsc.start();}
  engGain.gain.setTargetAtTime(on?.035:0,a.currentTime,.1);engOsc.frequency.setTargetAtTime(70+(pitch||0)*90,a.currentTime,.1);}catch(e){}}

/* ---------- 화면 ---------- */
function layout(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;fx.width=VW*DPR;fx.height=VH*DPR;S=Math.min(VW/360,VH/440);}
addEventListener('resize',layout);
function say(t){if(!SAVE.sound||autoPilot)return;try{const sp=window.speechSynthesis;if(!sp)return;sp.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[⭕⭐·=→]/g,' '));u.lang='ko-KR';u.rate=1.05;u.pitch=1.15;sp.speak(u);}catch(e){}}
function tip(t,cls,ms){const e=$('tip');e.textContent=t;e.className='show '+(cls||'');tipT=(ms||2600)/1000;say(t);}
function pop(t){const e=document.createElement('div');e.className='popfx';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1150);}
function doRoll(){if(state!=='cruise'||cr.roll>0)return;cr.roll=.7;beep(500,.12);setTimeout(()=>beep(900,.15),110);}
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.className='show';clearTimeout(toastT);toastT=setTimeout(()=>e.className='',1500);}
function confetti(n){const cols=['#ff5a5f','#ffc93c','#3b82f6','#2fc27a','#8b5cf6','#fff'];for(let i=0;i<n;i++)parts.push({x:Math.random()*VW,y:-20-Math.random()*VH*.5,vx:(Math.random()-.5)*3,vy:Math.random()*2+1,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:8+Math.random()*6,h:5+Math.random()*4,c:cols[i%cols.length],t:3+Math.random()*1.5});
  if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){fg.setTransform(DPR,0,0,DPR,0,0);fg.clearRect(0,0,VW,VH);parts=parts.filter(p=>p.t>0);
  for(const p of parts){p.t-=1/60;p.vy+=.06;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fg.save();fg.translate(p.x,p.y);fg.rotate(p.r);fg.globalAlpha=Math.min(1,p.t);fg.fillStyle=p.c;fg.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));fg.restore();}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fg.clearRect(0,0,VW,VH);}}

/* ---------- 비행기 그리기 ---------- */
function shade(c,k){const n=parseInt(c.slice(1),16),r=clamp(((n>>16)&255)*k,0,255)|0,g=clamp(((n>>8)&255)*k,0,255)|0,b=clamp((n&255)*k,0,255)|0;return'rgb('+r+','+g+','+b+')';}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawSide(g,P,col,t,gear){const L=46*P.len,dk=shade(col,.72);
  if(P.floats){g.strokeStyle='#8fa3b5';g.lineWidth=2;g.beginPath();g.moveTo(-6,5);g.lineTo(-9,13);g.moveTo(8,5);g.lineTo(6,13);g.stroke();g.fillStyle='#e9eef2';rr(g,-L*.36,12,L*.72,6,3);g.fill();}
  else if(gear){g.strokeStyle='#5b6b7a';g.lineWidth=2;g.beginPath();g.moveTo(L*.28,4);g.lineTo(L*.28,11);g.moveTo(-4,5);g.lineTo(-4,11);g.stroke();g.fillStyle='#2b3440';g.beginPath();g.arc(L*.28,12,3.2,0,TAU);g.arc(-4,12,3.6,0,TAU);g.fill();}
  g.fillStyle=dk;g.beginPath();g.moveTo(-L/2+2,-4);g.lineTo(-L/2-5,-19);g.lineTo(-L/2+7,-19);g.lineTo(-L/2+17,-4);g.closePath();g.fill();
  g.fillStyle=dk;rr(g,-L/2-6,-3,14,3.5,1.5);g.fill();
  g.fillStyle=col;rr(g,-L/2,-7,L,14,7);g.fill();
  if(P.hump){g.beginPath();g.ellipse(L*.2,-6,L*.2,5,0,Math.PI,TAU);g.fill();}
  g.fillStyle='rgba(255,255,255,.9)';rr(g,-L/2+5,2.5,L-12,3,1.5);g.fill();
  g.fillStyle='#bfe6ff';g.beginPath();g.ellipse(L/2-7,-2.5,4.5,3,-.2,0,TAU);g.fill();
  g.fillStyle='#e9f6ff';for(let x=-L/2+12;x<L/2-14;x+=7){g.beginPath();g.arc(x,-1.5,1.7,0,TAU);g.fill();}
  g.fillStyle=dk;g.beginPath();if(P.delta){g.moveTo(L*.18,2);g.lineTo(-L*.36,2);g.lineTo(-L*.42,11);g.closePath();}else{const w=P.wing;g.moveTo(6,1);g.lineTo(-7,1);g.lineTo(-7-9*w,10);g.lineTo(2-9*w,10);g.closePath();}g.fill();
  if(P.eng){g.fillStyle='#93a4b4';for(let i=0;i<P.eng/2;i++){rr(g,-9-i*9,8,11,5,2.5);g.fill();}}
  if(P.delta){g.fillStyle='#ffb347';g.beginPath();g.moveTo(-L/2,-3);g.lineTo(-L/2-8-Math.sin(t*40)*3,0);g.lineTo(-L/2,3);g.fill();}
  if(P.prop){g.fillStyle='#5b6b7a';g.beginPath();g.arc(L/2+1,0,2.5,0,TAU);g.fill();g.fillStyle='rgba(60,70,85,.35)';g.beginPath();g.ellipse(L/2+3,0,1.8,11*Math.abs(Math.sin(t*30))+2,0,0,TAU);g.fill();}
}
function drawRear(g,P,col,bank){const sp=38*P.wing,dk=shade(col,.72);g.save();g.rotate(bank);
  g.fillStyle=dk;g.beginPath();if(P.delta){g.moveTo(-sp,5);g.lineTo(0,-5);g.lineTo(sp,5);g.lineTo(0,3);}else{g.moveTo(-sp,-1);g.lineTo(-sp,2);g.lineTo(0,5);g.lineTo(sp,2);g.lineTo(sp,-1);g.lineTo(0,-2);}g.closePath();g.fill();
  if(P.eng){for(let i=0;i<P.eng/2;i++)for(const s of[-1,1]){const x=s*sp*(.38+i*.3);g.fillStyle='#93a4b4';g.beginPath();g.arc(x,6,4.5,0,TAU);g.fill();g.fillStyle='#ffb347';g.beginPath();g.arc(x,6,2,0,TAU);g.fill();}}
  if(P.floats){g.fillStyle='#e9eef2';for(const s of[-1,1]){g.beginPath();g.ellipse(s*13,15,4,3,0,0,TAU);g.fill();}}
  g.fillStyle=dk;rr(g,-14,-12,28,3.5,1.5);g.fill();rr(g,-2,-25,4,16,2);g.fill();
  g.fillStyle=col;g.beginPath();g.arc(0,0,10,0,TAU);g.fill();
  g.fillStyle='#bfe6ff';g.beginPath();g.arc(0,-2,6,Math.PI*1.1,Math.PI*1.9);g.fill();
  if(P.delta){g.fillStyle='#ffb347';g.beginPath();g.arc(0,2,4,0,TAU);g.fill();}
  g.restore();}

function renderStages(){$('mCoins').textContent=SAVE.coins;$('mode').textContent=SAVE.hard?'어려움':'쉬움';$('mode').setAttribute('aria-pressed',SAVE.hard);$('btnSound').textContent=SAVE.sound?'🔊':'🔇';

function drawMap(){const g=ctx;const sky=g.createLinearGradient(0,0,0,VH);sky.addColorStop(0,'#4aa8ee');sky.addColorStop(1,'#2f7fd0');g.fillStyle=sky;g.fillRect(0,0,VW,VH);

  for(let k=0;k<3;k++){g.beginPath();g.ellipse((.72+k*.04)*VW,(.645+k*.012)*VH,VW*.016,VH*.008,0,0,TAU);g.fill();}
  }else{
  land([[.30,.10],[.46,.09],[.50,.16],[.47,.27],[.40,.30],[.33,.27],[.31,.18]],'#7fd08a');           // 한반도(단순화)
  land([[.00,.06],[.24,.04],[.26,.12],[.14,.20],[.00,.22]],'#8fd596');                                   // 대륙
  land([[.62,.30],[.72,.26],[.86,.16],[.99,.08],[1,.16],[.90,.24],[.78,.33],[.66,.36]],'#7fd08a');       // 일본(단순화)
  g.fillStyle='#7fd08a';g.beginPath();g.ellipse(.27*VW,.36*VH,VW*.06,VH*.016,0,0,TAU);g.fill();g.beginPath();g.ellipse(.50*VW,.55*VH,VW*.03,VH*.014,.6,0,TAU);g.fill();
  land([[.40,.80],[.60,.74],[.86,.76],[.98,.84],[.96,.99],[.44,.99],[.36,.90]],'#f1c27d');               // 호주(단순화)
  }
  g.setLineDash([3,9]);g.lineCap='round';g.lineWidth=3.5;
  STAGES.forEach((s,i)=>{if((s.pg|0)!==mapPage)return;g.strokeStyle=unlocked(i)?'rgba(255,255,255,.9)':'rgba(255,255,255,.35)';g.beginPath();g.moveTo(H[0]*VW,H[1]*VH);const mx=(H[0]+s.pos[0])/2*VW+(i%2?30:-30),my=(H[1]+s.pos[1])/2*VH;g.quadraticCurveTo(mx,my,s.pos[0]*VW,s.pos[1]*VH);g.stroke();});
  g.setLineDash([]);
  const a=mapT*.6;g.save();g.translate(H[0]*VW+Math.cos(a)*46,H[1]*VH+Math.sin(a)*22-4);g.scale(Math.sin(a)>0?-1:1,1);g.scale(.8,.8);drawSide(g,curPlane(),curCol(),mapT,false);g.restore();}

/* ---------- 비행 시작 ---------- */
function startFlight(i){stageIdx=i;stage=STAGES[i];run={rings:0,ringTotal:stage.rings,star:0,takeoff:0,landing:0,zone:false,tries:0,coins:0};
  $('map').hidden=true;$('result').hidden=true;$('shop').hidden=true;$('hud').hidden=false;$('progDest').textContent=stage.em+' '+stage.name;audio();beginTakeoff();}
function beginTakeoff(){$('btnRoll').hidden=true;state='takeoff';T=0;pl={x:0,alt:0,v:0,vy:0,air:false,pitch:0,landed:false,liftX:0,early:0};stars=[];hold=false;
  tip('초록색이 되면 화면을 꾹!','',3500);}
function beginCruise(){state='cruise';T=0;const hard=SAVE.hard,objs=[];let x=0,y=0;const gap=4.2;
  for(let i=0;i<stage.rings;i++){x=clamp(x+rnd(-.55,.55),-.8,.8);y=clamp(y+rnd(-.5,.5),-.7,.7);const z=7+i*gap;objs.push({type:'ring',x,y,z,gold:i%5===4,turbo:i%6===2});
    if(Math.random()<.6)objs.push({type:Math.random()<.5?'star':'bal',x:clamp(x+rnd(-.4,.4),-.9,.9),y:clamp(y+rnd(-.4,.4),-.8,.8),z:z+gap/2});
    if(hard&&i%3===2)objs.push({type:'storm',x:clamp(x+(x>0?-1:1)*rnd(.7,1),-.95,.95),y:clamp(y+rnd(-.3,.3),-.8,.8),z:z+gap*.25});}
  for(let i=0;i<stage.rings*1.5;i++)objs.push({type:'cloud',x:rnd(-2.2,2.2),y:rnd(-.2,1.6),z:5+Math.random()*stage.rings*gap,r:rnd(.5,1.1)});
  for(let i=0;i<stage.rings/3;i++)objs.push({type:'isle',x:rnd(-2.5,2.5),y:-2.2,z:8+Math.random()*stage.rings*gap,r:rnd(.6,1.3)});
  const z0=7+(stage.rings-1)*gap;cr={px:0,py:0,tx:0,ty:0,bank:0,objs,z0,lastZ:z0,endT:0,shake:0,speed:hard?3.9:3.1,combo:0,best:0,roll:0,turbo:0,tricks:0};bursts=[];$('btnRoll').hidden=false;
  tip('손가락으로 움직여 ⭕ 통과! 빙글 버튼으로 묘기!','',3800);}
function beginLanding(){$('btnRoll').hidden=true;state='landing';T=0;run.tries++;pl={x:-900,alt:170,v:60,vy:-8,air:true,pitch:0,landed:false,bounce:0};hold=false;
  tip('꾹 = 위로, 떼면 아래로 · 초록 구역에 살살!','',4200);}

/* ---------- 업데이트 ---------- */
function update(dt){T+=dt;mapT+=dt;if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').className='';}
  if(state==='takeoff')updTakeoff(dt);else if(state==='cruise')updCruise(dt);else if(state==='landing')updLanding(dt);
  else if(state==='arrived'&&T>resultAt)showResult();
  if(state==='map'||state==='arrived')engine(false);}
const holding=()=>autoPilot?apHold():(hold||keys.Space||keys.ArrowUp);
function apHold(){if(state==='takeoff')return pl.v>=57;if(state==='landing'){const tgt=Math.max(0,-pl.x*.19);return pl.alt<tgt-2||(pl.alt<14&&pl.vy<-4.5);}return false;}
function updTakeoff(dt){const Vr=55,h=holding(),hard=SAVE.hard;engine(true,pl.v/80);
  if(T>.6)pl.v=Math.min(78,pl.v+17*dt);
  if(!pl.air){
    if(h&&pl.v>=Vr){pl.air=true;pl.liftX=pl.x;run.takeoff=pl.v<Vr+13?2:1;beep(520,.2);tip(run.takeoff===2?'완벽한 이륙! 꾹 누르고 올라가요':'이륙! 꾹 누르고 올라가요','good',2000);
      for(let i=0;i<3;i++)stars.push({x:pl.x+130+i*105,alt:38+i*40,got:false});}
    else if(h&&pl.v<Vr&&pl.v>8&&T-pl.early>2.2){pl.early=T;tip('아직! 초록색까지 기다려요','',1500);}
    if(pl.x>430&&!pl.air){if(hard){tip('활주로 끝! 다시 해 봐요','big',1800);beep(200,.4,'square');beginTakeoff();return;}
      pl.air=true;pl.liftX=pl.x;run.takeoff=1;tip('도와줄게요! 이륙!','good',1800);for(let i=0;i<3;i++)stars.push({x:pl.x+130+i*105,alt:38+i*40,got:false});}
    pl.pitch+=((h&&pl.v>20?-.12:0)-pl.pitch)*Math.min(1,dt*6);
  }else{const tv=(h||pl.x<pl.liftX+40)?26:-7;pl.vy+=(tv-pl.vy)*Math.min(1,dt*3);pl.alt=Math.max(.5,pl.alt+pl.vy*dt);if(pl.alt<=.5&&pl.vy<0)pl.vy=0;
    pl.pitch+=(clamp(-pl.vy/70,-.4,.25)-pl.pitch)*Math.min(1,dt*6);
    for(const s of stars)if(!s.got&&Math.abs(s.x-pl.x)<24&&Math.abs(s.alt-pl.alt)<24){s.got=true;run.star++;ding();}
    if(pl.alt>=165||pl.x>pl.liftX+620){beginCruise();return;}}
  pl.x+=pl.v*dt;setProg(.02+.06*clamp(pl.alt/165,0,1));}
function ringR(){return VW*(SAVE.hard?.15:.2);}
function planeScr(px,py){return[VW/2+px*VW*.36,VH*.56-py*VH*.22];}
function updCruise(dt){const hard=SAVE.hard;engine(true,cr.turbo>0?1.5:.9);if(cr.roll>0)cr.roll-=dt;if(cr.turbo>0)cr.turbo-=dt;const spd=cr.speed*(cr.turbo>0?1.7:1);
  if(autoPilot&&apRoll){const n=cr.objs.find(o=>o.type==='ring'&&o.z>1&&!o.hit);if(n&&n.z<1.8&&cr.roll<=0)doRoll();}
  if(autoPilot){const n=cr.objs.find(o=>o.type==='ring'&&o.z>1&&!o.hit);if(n){cr.tx=n.x;cr.ty=n.y;}}
  else{const k=1.7*dt;if(keys.ArrowLeft)cr.tx-=k;if(keys.ArrowRight)cr.tx+=k;if(keys.ArrowUp)cr.ty+=k;if(keys.ArrowDown)cr.ty-=k;}
  cr.tx=clamp(cr.tx,-1,1);cr.ty=clamp(cr.ty,-1,1);
  const ox=cr.px;cr.px+=(cr.tx-cr.px)*Math.min(1,dt*(hard?6:8));cr.py+=(cr.ty-cr.py)*Math.min(1,dt*(hard?6:8));
  cr.bank+=(clamp((cr.px-ox)/dt*.5,-.6,.6)-cr.bank)*Math.min(1,dt*8);if(cr.shake>0)cr.shake-=dt;
  const [sx,sy]=planeScr(cr.px,cr.py),R=ringR();let last=-1;
  for(const o of cr.objs){const z0=o.z;o.z-=spd*dt;if(o.type==='ring')last=Math.max(last,o.z);
    if(z0>1&&o.z<=1&&!o.hit){const [x,y]=planeScr(o.x,o.y),d=Math.hypot(x-sx,y-sy);
      if(o.type==='ring'){if(d<R*(hard?.95:1.12)){o.hit=1;run.rings++;ding();cr.combo++;cr.best=Math.max(cr.best,cr.combo);
          for(let k=0;k<14;k++){const a=k/14*TAU;bursts.push({x,y,vx:Math.cos(a)*rnd(90,200),vy:Math.sin(a)*rnd(90,200),t:.6,c:o.gold?'hsl('+k*26+',95%,62%)':o.turbo?'#3fd0ff':'#ffc93c'});}
          if(o.gold){run.star+=2;pop('무지개 링! +3');}
          if(o.turbo){cr.turbo=2.2;pop('터보! 슈웅~');beep(300,.4,'sawtooth',.12);}
          if(cr.roll>0){run.star+=2;cr.tricks++;pop('묘기 통과! +2');}
          else if(cr.combo%3===0){run.star+=1;pop(cr.combo+'연속! +1');}}
        else{o.hit=-1;cr.combo=0;beep(240,.12,'sine',.08);}}
      else if(o.type==='star'||o.type==='bal'){if(d<R*.9){o.hit=1;run.star++;if(o.type==='bal'){beep(180,.08,'square',.2);pop('팡!');}else beep(1760,.1);}}
      else if(o.type==='storm'){if(d<R*.85){o.hit=1;cr.shake=.5;run.star=Math.max(0,run.star-2);beep(110,.5,'sawtooth',.2);tip('번개구름! ⭐ -2','big',1300);}}}}
  cr.objs=cr.objs.filter(o=>o.z>.35);cr.lastZ=last;
  setProg(.08+.8*clamp(1-Math.max(last,0)/cr.z0,0,1));
  if(last<1){cr.endT+=dt;if(cr.endT>1.6){beginLanding();return;}}}
function updLanding(dt){const hard=SAVE.hard,h=holding();engine(true,.5);
  if(!pl.landed){const tv=h?10:-17;pl.vy+=(tv-pl.vy)*Math.min(1,dt*3)+(hard?Math.sin(T*1.9)*9*dt:0);pl.alt+=pl.vy*dt;pl.x+=pl.v*dt;pl.v=Math.max(48,pl.v-2*dt);
    pl.alt=Math.min(pl.alt,215);pl.pitch+=(clamp(-pl.vy/60,-.3,.3)-pl.pitch)*Math.min(1,dt*6);
    if(pl.alt<=0){const vy=-pl.vy;
      if(pl.x<-45){if(hard){tip('활주로 앞에 내렸어요! 다시','big',1800);beep(200,.4,'square');beginLanding();return;}
        pl.alt=3;pl.vy=16;tip('아직 활주로가 아니에요! 조금만 더','',1600);beep(300,.15);}
      else if(pl.x>430){goAround();return;}
      else{pl.alt=0;pl.landed=true;pl.vy=0;run.zone=pl.x>=0&&pl.x<=170;const a=hard?4.5:6.5,b=hard?9:12;run.landing=vy<a?3:vy<b?2:1;pl.bounce=run.landing===1?.5:0;
        beep(run.landing===3?660:run.landing===2?440:160,.25,run.landing===1?'sawtooth':'triangle',.2);
        tip(run.landing===3?'살포시 착륙! 최고예요':run.landing===2?'착륙 성공!':'쿵! 다음엔 더 살살','good',2200);}}
    else if(pl.x>470){goAround();return;}
  }else{pl.v=Math.max(0,pl.v-30*dt);pl.x+=pl.v*dt;pl.pitch*=.9;if(pl.bounce>0)pl.bounce-=dt;
    if(pl.v<=0&&state==='landing'){state='arrived';T=0;resultAt=.7;}}
  setProg(.9+.1*clamp((pl.x+900)/900,0,1));}
function goAround(){tip('활주로를 지나쳤어요. 한 바퀴 돌아서 다시!','',2200);beep(300,.2);beginLanding();}
function setProg(p){$('progBar').style.width='calc('+(p*100).toFixed(1)+'% - 8px)';$('progPlane').style.left=clamp(p*100,6,80)+'%';$('hCoins').textContent=run.rings+run.star;}

/* ---------- 그리기 ---------- */
function skyCols(){if(state==='cruise'&&stage&&stage.long){const p=clamp(1-Math.max(cr.lastZ,0)/cr.z0,0,1);
    const K=[['#58b7f5','#bfe6ff'],['#ff9a5a','#ffd9a0'],['#141b3c','#3a3f7a'],['#58b7f5','#ffe2b8']];const f=p*3,i=Math.min(2,Math.floor(f)),t=f-i;return[mix(K[i][0],K[i+1][0],t),mix(K[i][1],K[i+1][1],t),p>.45&&p<.85];}
  return['#58b7f5','#c9ecff',false];}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const r=lerp(x>>16&255,y>>16&255,t)|0,g=lerp(x>>8&255,y>>8&255,t)|0,bl=lerp(x&255,y&255,t)|0;return'rgb('+r+','+g+','+bl+')';}

  if(G3.ok){G3.draw();g.clearRect(0,0,VW,VH);const vx=VW/2,vy=VH*.5;
    if(cr.turbo>0){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;for(let k=0;k<26;k++){const a=k*2.4+T*3,r0=60+((k*37+T*900)%Math.max(VW,VH)),r1=r0+50;g.beginPath();g.moveTo(vx+Math.cos(a)*r0,vy+Math.sin(a)*r0);g.lineTo(vx+Math.cos(a)*r1,vy+Math.sin(a)*r1);g.stroke();}}
    bursts=bursts.filter(b=>b.t>0);for(const b of bursts){b.t-=1/60;b.x+=b.vx/60;b.y+=b.vy/60;g.globalAlpha=clamp(b.t*2,0,1);g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,4,0,TAU);g.fill();}g.globalAlpha=1;
    g.fillStyle='#fff';g.strokeStyle='rgba(14,42,71,.6)';g.lineWidth=4;g.font='22px Jua,sans-serif';g.textAlign='center';const t='⭕ '+run.rings+' / '+run.ringTotal+(cr.combo>=2?'   🔥 '+cr.combo+'연속':'');g.strokeText(t,VW/2,VH-26);g.fillText(t,VW/2,VH-26);return;}
  const [c1,c2,night]=skyCols(),hy=VH*.47;const sky=g.createLinearGradient(0,0,0,hy);sky.addColorStop(0,c1);sky.addColorStop(1,c2);g.fillStyle=sky;g.fillRect(0,0,VW,hy+1);
  if(night){g.fillStyle='#fff';for(let i=0;i<40;i++){g.globalAlpha=.4+.6*Math.abs(Math.sin(T+i));g.fillRect((i*97)%VW,(i*53)%hy,2,2);}g.globalAlpha=1;g.font='40px sans-serif';g.fillText('🌙',VW*.78,hy*.3);}
  else{g.fillStyle='#ffe27a';g.beginPath();g.arc(VW*.8,hy*.28,26,0,TAU);g.fill();}
  const sea=g.createLinearGradient(0,hy,0,VH);sea.addColorStop(0,night?'#1b2a5a':'#3a9be0');sea.addColorStop(1,night?'#0d1838':'#1f6fc0');g.fillStyle=sea;g.fillRect(0,hy,VW,VH-hy);
  g.strokeStyle='rgba(255,255,255,.22)';for(let k=0;k<9;k++){const f=((T*.35*cr.speed/3+k/9)%1);const y=hy+(VH-hy)*f*f;g.lineWidth=1+f*3;g.beginPath();g.moveTo(0,y);g.lineTo(VW,y);g.stroke();}
  {const dx=(T*55)%(VW+200)-100,ph=(T*1.6)%Math.PI;if(Math.floor(T/4)%2===0){g.font='26px sans-serif';g.textAlign='center';g.fillText('🐬',dx,hy+(VH-hy)*.3-Math.sin(ph)*22);}}
  const sh=cr.shake>0?[rnd(-8,8),rnd(-8,8)]:[0,0];g.save();g.translate(sh[0],sh[1]);
  const vpx=VW/2-cr.px*VW*.05,vpy=hy+cr.py*VH*.03,R=ringR();
  const proj=o=>{const [x1,y1]=planeScr(o.x,o.y);return[vpx+(x1-vpx)/o.z,vpy+(y1-vpy)/o.z,1/o.z];};
  if(cr.turbo>0){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;for(let k=0;k<26;k++){const a=k*2.4+T*3,r0=60+((k*37+T*900)%Math.max(VW,VH)),r1=r0+50;g.beginPath();g.moveTo(vpx+Math.cos(a)*r0,vpy+Math.sin(a)*r0);g.lineTo(vpx+Math.cos(a)*r1,vpy+Math.sin(a)*r1);g.stroke();}}
  const list=cr.objs.filter(o=>o.z<16).sort((a,b)=>b.z-a.z);let planeDrawn=false;
  const drawPlane=()=>{const [sx,sy]=planeScr(cr.px,cr.py);g.save();g.translate(sx,sy);g.scale(S*1.45,S*1.45);drawRear(g,curPlane(),curCol(),cr.bank+(cr.roll>0?(1-cr.roll/.7)*TAU:0));g.restore();planeDrawn=true;};
  for(const o of list){if(!planeDrawn&&o.z<1)drawPlane();const [x,y,k]=proj(o);const a=clamp((16-o.z)/4,0,1)*(o.z<1?clamp((o.z-.35)/.65,0,1):1);g.globalAlpha=a;
    if(o.type==='cloud'){g.fillStyle=night?'rgba(160,170,210,.5)':'rgba(255,255,255,.8)';const r=VW*.16*o.r*k;g.beginPath();g.ellipse(x,y,r,r*.4,0,0,TAU);g.ellipse(x+r*.4,y-r*.25,r*.6,r*.35,0,0,TAU);g.fill();}
    else if(o.type==='isle'){const r=VW*.2*o.r*k;g.fillStyle='#e9d9a6';g.beginPath();g.ellipse(x,y,r*1.15,r*.24,0,0,TAU);g.fill();g.fillStyle='#5fae7b';g.beginPath();g.ellipse(x,y-r*.08,r*.85,r*.3,0,Math.PI,TAU);g.fill();}
    else if(o.type==='ring'){const r=R*k;g.lineWidth=Math.max(2,R*.16*k);g.strokeStyle=o.hit===1?'#2fc27a':o.hit===-1?'rgba(255,255,255,.35)':o.gold?'hsl('+((T*240)%360)+',95%,62%)':o.turbo?'#3fd0ff':'#ffc93c';g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();
      if(!o.hit){g.lineWidth=Math.max(1,R*.05*k);g.strokeStyle='#fff';g.beginPath();g.arc(x,y,r*.82,0,TAU);g.stroke();}}
    else if((o.type==='star'||o.type==='bal')&&!o.hit){g.font=Math.max(8,R*.7*k)+'px sans-serif';g.textAlign='center';g.fillText(o.type==='bal'?'🎈':'⭐',x,y+R*.25*k);}
    else if(o.type==='storm'){g.font=Math.max(10,R*1.5*k)+'px sans-serif';g.textAlign='center';g.fillText('⛈️',x,y+R*.5*k);}
    g.globalAlpha=1;}
  if(!planeDrawn)drawPlane();
  bursts=bursts.filter(b=>b.t>0);for(const b of bursts){b.t-=1/60;b.x+=b.vx/60;b.y+=b.vy/60;g.globalAlpha=clamp(b.t*2,0,1);g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,4,0,TAU);g.fill();}g.globalAlpha=1;g.restore();
  g.fillStyle='#fff';g.strokeStyle='rgba(14,42,71,.6)';g.lineWidth=4;g.font='22px Jua,sans-serif';g.textAlign='center';const t='⭕ '+run.rings+' / '+run.ringTotal+(cr.combo>=2?'   🔥 '+cr.combo+'연속':'');g.strokeText(t,VW/2,VH-26);g.fillText(t,VW/2,VH-26);}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);$('gl').hidden=!(G3.ok&&state==='cruise');
  if(state==='map')drawMap();else if(state==='cruise')drawCruise();else drawSide2();}

/* ---------- 결과 ---------- */
function showResult(){state='result';const hard=SAVE.hard,ratio=run.rings/run.ringTotal;
  const st=(ratio>=.8&&run.landing>=2)?3:(ratio>=.5||run.landing>=2)?2:1;
  const base=run.rings+run.star+(run.takeoff===2?3:0)+run.landing*2+(run.zone?2:0),coins=base*(hard?2:1);
  SAVE.coins+=coins;const first=!(SAVE.stars[stage.id]|0);SAVE.stars[stage.id]=Math.max(SAVE.stars[stage.id]|0,st);save();
  $('rTitle').textContent=stage.em+' '+stage.name+' 도착!';$('rStars').innerHTML='★'.repeat(st)+'<i>'+'★'.repeat(3-st)+'</i>';
  $('rRows').innerHTML='<div><span>⭕ 링 통과</span><b>'+run.rings+' / '+run.ringTotal+'</b></div><div><span>🔥 최고 연속 · 🌀 묘기</span><b>'+cr.best+'연속 · '+cr.tricks+'번</b></div><div><span>🛫 이륙</span><b>'+(run.takeoff===2?'완벽!':'성공')+'</b></div><div><span>🛬 착륙</span><b>'+['','쿵!','성공','살포시!'][run.landing]+(run.zone?' · 초록 구역':'')+'</b></div><div><span>⭐ 받은 별</span><b>+'+coins+(hard?' (어려움 ×2)':'')+'</b></div>';
  $('rFact').innerHTML='<b>'+stage.name+'</b> · 서울에서 '+stage.km+'<br>진짜 비행기로 '+stage.real+' 걸려요. '+stage.fact;
  const nx=stageIdx+1<STAGES.length;$('rNext').hidden=!nx;if(nx)$('rNext').textContent='다음 여행: '+STAGES[stageIdx+1].em+' '+STAGES[stageIdx+1].name+' →';
  $('hud').hidden=true;$('result').hidden=false;confetti(st===3?220:st===2?120:60);cheer();if(first&&nx)setTimeout(()=>toast(STAGES[stageIdx+1].name+' 길이 열렸어요!'),600);}
function toMap(){$('btnRoll').hidden=true;try{speechSynthesis.cancel();}catch(e){}state='map';$('result').hidden=true;$('shop').hidden=true;$('hud').hidden=true;$('map').hidden=false;$('tip').className='';renderStages();}

$('shop').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;const k=b.dataset.k,id=b.dataset.id,arr=k==='plane'?PLANES:COLORS,o=arr.find(x=>x.id===id),own=k==='plane'?SAVE.planes:SAVE.colors;
