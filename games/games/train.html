<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>칙칙폭폭 기관사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
:root{--ink:#1d1b3a;--paper:#fff8ec;--tomato:#ff5a4d;--sun:#ffd23f;--leaf:#34c27a;--sky:#8fd0f5;--f-disp:'Jua','Apple SD Gothic Neo',sans-serif;--f-body:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--f-body);touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px 10px}
#next{flex:1;min-width:0}
#nextTx{font-family:var(--f-disp);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:9px;border:2px solid var(--ink);border-radius:9px;background:#fff;margin-top:4px;overflow:hidden}
#barIn{height:100%;width:0;background:var(--leaf)}
#score{font-family:var(--f-disp);font-size:17px;white-space:nowrap;text-align:right;line-height:1.25}
#btnQuit{pointer-events:auto;font-family:var(--f-disp);font-size:15px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 10px;color:var(--ink)}
.ctl{position:fixed;left:0;right:0;bottom:0;padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.pad{pointer-events:auto;font-family:var(--f-disp);color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);width:min(31vw,150px);height:min(27vw,118px);font-size:clamp(17px,5vw,24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05}
.pad b{font-size:1.6em;font-weight:400}
.pad.on{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:14px;pointer-events:none}
#bBrake{background:#ff8a80}#bGo{background:#7be3a4}
#bHorn{background:var(--sun);width:min(24vw,104px);height:min(20vw,84px);border-radius:50%;font-size:clamp(14px,4vw,19px)}
.hint{animation:hint .45s infinite alternate}
@keyframes hint{from{filter:none}to{filter:brightness(1.35);box-shadow:0 7px 0 var(--ink),0 0 0 8px rgba(255,255,255,.85)}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:rgba(29,27,58,.38);overflow:auto}
.box{width:min(100%,560px);background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px 16px 18px;text-align:center;max-height:100%;overflow:auto}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,9vw,44px);margin:2px 0 0;letter-spacing:-.5px}
h1 span{color:var(--tomato)}
.kicker{font-size:12px;font-weight:700;letter-spacing:3px;margin:0}
.sub{margin:4px 0 12px;font-size:14.5px;font-weight:500}
.lines{display:grid;gap:10px}
.line{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--c);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px 12px 8px 8px}
.line canvas{flex:none;width:112px;height:66px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.line .nm{font-family:var(--f-disp);font-size:21px;display:block}
.line .ds{font-size:13px;font-weight:500;display:block}
.line .bs{font-family:var(--f-disp);font-size:14px;display:block;margin-top:2px}
.line.lock{filter:grayscale(.85);opacity:.72}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sm{font-family:var(--f-disp);font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:7px 14px}
.big{display:block;width:100%;font-family:var(--f-disp);font-size:22px;color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:11px;margin-top:10px}
.big.alt{background:#fff;font-size:18px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 0;font-size:12.5px;font-weight:700}
.how span{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px}
#rStars{font-size:34px;letter-spacing:2px;margin:6px 0 0}
#rMedal{font-size:64px;line-height:1.1}
#rList{text-align:left;margin:8px auto 0;padding:0;list-style:none;font-size:14.5px;font-weight:500;max-width:330px}
#rList li{display:flex;justify-content:space-between;border-bottom:2px dashed rgba(29,27,58,.2);padding:4px 2px}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:520px){.pad{height:84px}#bHorn{height:64px;width:84px}.rcol{flex-direction:row;align-items:flex-end}.box{padding:10px 14px}.how{display:none}.line canvas{width:92px;height:52px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <button id="btnQuit">✕</button>
  <div class="card" id="next"><div id="nextTx">다음 역</div><div id="bar"><div id="barIn"></div></div></div>
  <div class="card" id="score">⭐ 0<br>💮 0</div>
</div>
<div class="ctl" id="ctl" hidden>
  <button class="pad" id="bBrake"><b>🛑</b>멈춰</button>
  <div class="rcol"><button class="pad" id="bHorn"><b>📯</b>빵빵</button>
  <button class="pad" id="bGo"><b>🚂</b>출발</button></div>
</div>

<div class="ov" id="menu">
  <div class="box">
    <button class="sm" id="btnHub" hidden style="float:left">← 게임 목록</button>
    <p class="kicker">MONGFAM RAILWAY</p>
    <h1>칙칙폭폭 <span>기관사</span></h1>
    <p class="sub">기관사가 되어 역마다 딱 맞게 세워 보세요.</p>
    <div class="lines" id="lines"></div>
    <div class="how"><span>🚂 누르고 있으면 달려요</span><span>🛑 누르고 있으면 멈춰요</span><span>📯 동물·친구에게 빵빵</span></div>
    <div class="row"><button class="sm" id="btnSound">🔊 소리 켬</button><button class="sm" id="btnHelp">💡 도움 켬</button></div>
  </div>
</div>

<div class="ov" id="over" hidden>
  <div class="box">
    <div id="rMedal">🥇</div>
    <h1 id="rTitle" style="font-size:30px">도착했어요!</h1>
    <div id="rStars"></div>
    <ul id="rList"></ul>
    <p id="oBest" style="font-weight:700;margin:8px 0 0"></p>
    <button class="big" id="btnAgain">한 번 더!</button>
    <button class="big alt" id="btnMenu">노선 고르기</button>
  </div>
</div>

<script src="./ticket.js"></script>
<script src="./fx.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),g=cv.getContext('2d');
let W=0,H=0,D=1;
function fit(){D=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const hs=n=>{const s=Math.sin(n*127.1+11.7)*43758.5453;return s-Math.floor(s);};
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function mix(a,b,t){if(t<=0)return a;if(t>=1)return b;const A=rgb(a),B=rgb(b);return'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else{g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}}

/* ───── 저장 ───── */
const KEY='mong_train_v1';let SAVE={sound:true,help:true,best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)SAVE=Object.assign(SAVE,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}

/* ───── 노선 ───── */
const PAL={
 forest:{s0:'#6ec4ff',s1:'#e9f8ff',far:'#9cc7dc',mid:'#84cf8c',near:'#3f9a58',g0:'#77cc6d',g1:'#3f9150',rock:'#8d8fa6',rock2:'#5d5f7a'},
 city:{s0:'#6aa8ff',s1:'#ffe6cf',far:'#b7c2ea',mid:'#93a0d6',near:'#6d7cc0',g0:'#a9b3bf',g1:'#737d8c',rock:'#9a8672',rock2:'#6b5a4c'},
 coast:{s0:'#35b6f2',s1:'#dff8ff',far:'#8fd0e6',mid:'#27a3d4',near:'#2f9e6b',g0:'#f3dfa4',g1:'#d2b56f',rock:'#b39c86',rock2:'#7f6a58'},
 snow:{s0:'#9cbfe8',s1:'#f5faff',far:'#cfdcee',mid:'#e6eef8',near:'#3f7f74',g0:'#f6fafe',g1:'#c9d8ea',rock:'#a2acc2',rock2:'#6f7a94'}
};
const LINES=[
 {id:'forest',name:'숲속 꼬마기차',ds:'칙칙폭폭 달려요 · 역 5개',c:'#bfeeb8',train:'steam',vmax:560,acc:260,brk:430,kmh:.2,th:['forest','forest'],
  st:['도토리역','다람쥐역','폭포역','딸기밭역','숲끝역'],
  segs:[['animal','bridge','animal'],['animal','tunnel','wave','animal','limit'],['signal','animal','bridge','animal','animal'],['animal','tunnel','wave','animal']]},
 {id:'city',name:'도시 지하철',ds:'땅속으로 쌩쌩 · 역 6개',c:'#c9d4ff',train:'metro',vmax:760,acc:360,brk:580,kmh:.2,th:['city','city'],
  st:['별빛역','시장역','강변역','공원역','도서관역','하늘역'],
  segs:[['uin','signal'],['limit','uout','animal'],['animal','bridge','wave','animal'],['animal','animal','uin','signal'],['limit','uout','animal','wave','animal']]},
 {id:'bullet',name:'번개 고속열차',ds:'바다에서 눈 산까지 · 역 5개',c:'#bfe9ff',train:'bullet',vmax:1100,acc:480,brk:800,kmh:.3,th:['coast','snow'],
  st:['바다역','등대역','구름다리역','눈꽃역','산꼭대기역'],
  segs:[['animal','bridge','wave','animal','limit'],['animal','tunnel','signal','bridge','animal'],['animal','animal','tunnel','wave'],['animal','limit','signal','animal','tunnel']]}
];
function build(LN){const k=LN.vmax/440,L={st:[],tun:[],br:[],sig:[],lim:[],ani:[],wav:[]};let x=900,open=null,an=0;
 const kinds={forest:['deer','rabbit','cow','duck','sheep'],city:['cat','duck','rabbit'],bullet:['crab','deer','sheep','duck']}[LN.id];
 L.st.push({x:x,name:LN.st[0],served:true,stars:-1});
 LN.segs.forEach(function(seg,i){x+=900*k;
  seg.forEach(function(e){
   if(e==='tunnel'){const w=1500*k;L.tun.push({x0:x,x1:x+w,kind:'m'});x+=w;}
   else if(e==='bridge'){const w=1300*k;L.br.push({x0:x,x1:x+w});x+=w;}
   else if(e==='uin'){open=x;x+=250;}
   else if(e==='uout'){L.tun.push({x0:open,x1:x,kind:'u'});open=null;x+=250;}
   else if(e==='signal'){x+=800*k;L.sig.push({x:x,t:0});x+=200;}
   else if(e==='limit'){x+=600*k;const w=1100*k;L.lim.push({x0:x,x1:x+w,v:LN.vmax*.5,over:0});x+=w;}
   else if(e==='animal'){x+=380*k;L.ani.push({x:x,type:kinds[an++%kinds.length],t:0});x+=150-200*k;}
   else if(e==='wave'){x+=600*k;L.wav.push({x:x,t:0});x+=200;}
   x+=450*k;});
  x+=900*k;L.st.push({x:x,name:LN.st[i+1],stars:-1});});
 if(open!=null)L.tun.push({x0:open,x1:x+900,kind:'u'});
 L.len=x+1800;L.mid=L.st[Math.floor(L.st.length/2)].x;
 L.st.forEach(function(s,i){s.under=L.tun.some(t=>t.kind==='u'&&s.x>t.x0&&s.x<t.x1);s.ppl=[];const n=3+Math.floor(hs(i*7+LN.vmax)*3);for(let j=0;j<n;j++)s.ppl.push({dx:-40-j*58-hs(i*31+j)*30,c:['#ff7b6b','#ffd23f','#6fb7ff','#b58cff','#5fd39a','#ff9ecb'][(i*3+j)%6],h:38+hs(i+j*5)*12});});
 L.maxStars=(L.st.length-1)*3;L.maxStamps=L.sig.length+L.lim.length+L.ani.length+L.wav.length;return L;}

/* ───── 소리 ───── */
let AC=null,engG=null,engF=null;
function ac(){if(!SAVE.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null;}return AC;}
function tone(f,d,type,vol,to,at){const a=ac();if(!a)return;try{const o=a.createOscillator(),k=a.createGain(),t=a.currentTime+(at||0);o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);k.gain.setValueAtTime(0.0001,t);k.gain.linearRampToValueAtTime(vol||.12,t+.02);k.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(k);k.connect(a.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
let NB=null;function nbuf(a){if(NB)return NB;NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
function nz(d,vol,f,at){const a=ac();if(!a)return;try{const s=a.createBufferSource(),fl=a.createBiquadFilter(),k=a.createGain(),t=a.currentTime+(at||0);s.buffer=nbuf(a);fl.type='lowpass';fl.frequency.value=f||800;k.gain.setValueAtTime(vol||.1,t);k.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(k);k.connect(a.destination);s.start(t,Math.random()*.5,d+.05);}catch(e){}}
function engStart(){const a=ac();if(!a||engG)return;try{const s=a.createBufferSource();s.buffer=nbuf(a);s.loop=true;engF=a.createBiquadFilter();engF.type='lowpass';engF.frequency.value=120;engG=a.createGain();engG.gain.value=0;s.connect(engF);engF.connect(engG);engG.connect(a.destination);s.start();}catch(e){}}
function engSet(r,tun){if(!engG||!AC)return;try{engG.gain.setTargetAtTime(SAVE.sound?(.03+.11*r)*(tun?1.5:1):0,AC.currentTime,.1);engF.frequency.setTargetAtTime(110+520*r,AC.currentTime,.1);}catch(e){}}
function horn(){const k=S?S.LN.train:'steam';if(k==='steam'){tone(880,.55,'triangle',.13);tone(1108,.55,'triangle',.1);tone(660,.5,'sine',.07);}else if(k==='metro'){tone(440,.36,'square',.05);tone(554,.36,'square',.045);}else{tone(330,.5,'sawtooth',.05);tone(415,.5,'sawtooth',.05);}}
function fx(n){if(SAVE.sound&&window.MongFx)try{MongFx.sfx(n);}catch(e){}}

/* ───── 상태 ───── */
let S=null,mode='menu',auto=false;
const IN={go:false,brake:false,horn:false};
function start(i){const LN=LINES[i],L=build(LN);IN.go=IN.brake=IN.horn=false;
 S={i:i,LN:LN,L:L,pos:L.st[0].x,v:0,bk:0,t:0,si:1,stars:0,stamps:0,st:'run',bT:0,door:0,estop:0,estopAni:null,hornT:0,msg:[],parts:[],shake:0,z:1,camx:L.st[0].x,hint:false,hornHint:false,riders:2,endT:0,cabA:1,click:0,chuff:0,lamp:0};
 mode='play';$('menu').hidden=true;$('over').hidden=true;$('hud').hidden=false;$('ctl').hidden=false;engStart();
 say('출발 버튼을 꾹 눌러요!',2.6);tone(784,.2,'triangle',.1);tone(1046,.3,'triangle',.1,0,.18);}
function say(t,d,c){if(!S)return;S.msg=S.msg.filter(m=>m.t<m.d-.25).slice(-1);S.msg.push({tx:t,t:0,d:d||1.8,c:c||'#fff8ec'});}
function stamp(t){S.stamps++;say('💮 '+t,1.7,'#fff3b0');fx('coin');}
function inTun(x){const T=S.L.tun;for(let i=0;i<T.length;i++)if(x>T[i].x0&&x<T[i].x1)return T[i];return null;}

function update(dt){const LN=S.LN,L=S.L;S.t+=dt;
 if(auto)pilot();
 const hornEdge=IN.horn&&!S.hornP;S.hornP=IN.horn;if(hornEdge){S.hornT=.55;horn();}S.hornT=Math.max(0,S.hornT-dt);
 /* 달리기 */
 if(S.st==='run'){let a;
  if(S.estop){a=-LN.brk*1.7;}
  else if(IN.brake){S.bk=Math.min(1,S.bk+dt*3.2);a=-LN.brk*S.bk;}
  else{S.bk=0;if(IN.go&&S.door<.03)a=LN.acc*(1-.8*Math.pow(S.v/LN.vmax,2))*(S.v<50?.8:1);else a=-(14+S.v*.03);}
  S.v=clamp(S.v+a*dt,0,LN.vmax);if(S.v<2.5&&!(IN.go&&!IN.brake&&!S.estop))S.v=0;S.pos+=S.v*dt;S.acc=a;
 }
 const sr=S.v/LN.vmax,front=S.pos;
 /* 역 */
 const st=L.st[S.si],last=S.si===L.st.length-1;
 if(S.st==='run'&&st){const d=front-st.x;
  if(S.v===0&&Math.abs(d)<=190&&!st.served){st.served=true;const e=Math.abs(d);st.stars=e<=46?3:e<=115?2:1;S.stars+=st.stars;S.st='board';S.bT=0;
   say(st.stars===3?'⭐⭐⭐ 딱 맞았어요!':st.stars===2?'⭐⭐ 잘 세웠어요!':'⭐ 도착!',2,'#fff3b0');fx(st.stars===3?'win':'coin');tone(784,.25,'sine',.1);tone(659,.4,'sine',.1,0,.26);st.board=st.ppl.length;}
  else if(d>190&&!st.served){st.served=true;st.stars=0;say('앗, '+st.name+'을 지나쳤어요',2,'#ffd0c9');fx('deny');if(last){S.estop=1;S.endMiss=1;}else S.si++;}
  if(S.endMiss&&S.v===0){S.st='done';S.endT=0;}
 }
 if(S.st==='board'){S.bT+=dt;S.door=S.bT<.5?S.bT/.5:S.bT<2.2?1:Math.max(0,1-(S.bT-2.2)/.4);
  if(S.bT>.6&&S.bT<2.2){const k=(S.bT-.6)/1.5;st.ppl.forEach((p,j)=>{p.go=clamp(k*1.5-j*.1,0,1);});}
  if(S.bT>=2.6){st.ppl.forEach(p=>p.go=1);S.riders+=st.ppl.length;S.door=0;if(last){S.st='done';S.endT=0;}else{S.st='run';S.si++;say('문이 닫혔어요. 출발!',1.4);tone(1046,.15,'triangle',.09);}}}
 if(S.st==='done'){S.endT+=dt;if(S.endT>1.1&&mode==='play')finish();}
 /* 신호등 */
 const k=LN.vmax/440;
