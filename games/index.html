<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffd84d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게임방">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>몽팸게임방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one screen, no scroll. Sticker-album toy box: title strip, one big featured tile, a row of three game tiles, a row of two learning tiles. Wide screens put the featured tile on the left. */
:root{
  --ground:#ffd84d; --ground-dot:#f6c531; --ink:#1d1b3a; --paper:#fffaf0;
  --sky:#58b7f5; --ice:#bfe6ff; --grass:#3fae5a; --tomato:#ff5a4d; --orange:#ff9f2e; --mint:#35c9a3; --violet:#7b5cf0;
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);background-image:radial-gradient(var(--ground-dot) 1.6px,transparent 1.8px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);
  padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
main{height:100%;max-width:560px;margin:0 auto;display:grid;gap:12px;grid-template-rows:auto minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,.78fr) auto;
  grid-template-areas:"head" "hero" "games" "learn" "foot"}
header{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.kicker{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--ink);opacity:.7;margin:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1;margin:2px 0 0;color:var(--paper);
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:.01em}
h1 b{font-weight:400;color:var(--tomato)}
.count{font-family:var(--f-disp);font-size:14px;background:var(--ink);color:var(--ground);padding:6px 12px;border-radius:999px;white-space:nowrap;transform:rotate(3deg)}
.row{display:grid;gap:12px;min-height:0}
.games{grid-area:games;grid-template-columns:repeat(3,minmax(0,1fr))}
.learn{grid-area:learn;grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{position:relative;display:block;min-height:0;min-width:0;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--c,var(--sky));color:var(--ink);text-decoration:none;
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.label{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px 8px;background:var(--paper);border-top:3px solid var(--ink)}
.nm{font-family:var(--f-disp);font-size:clamp(14px,4.1vw,19px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.go{flex:none;font-family:var(--f-disp);font-size:13px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 9px}
.games .go,.learn .go{display:none}
.hero{grid-area:hero}
.hero .label{padding:10px 14px 11px}
.hero .nm{font-size:clamp(20px,6vw,26px)}
.hero .go{display:block;font-size:16px;padding:6px 14px;background:var(--tomato);color:var(--paper);border:2.5px solid var(--ink)}
.sub{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:10px;left:10px;font-family:var(--f-disp);font-size:14px;background:var(--tomato);color:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:3px 9px;transform:rotate(-6deg);z-index:1}
.badge.b3{left:auto;right:10px;background:var(--violet);transform:rotate(5deg);font-size:18px}
.tag{position:absolute;top:7px;left:7px;font-family:var(--f-body);font-weight:700;font-size:10.5px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:1px 6px;z-index:1}
footer{grid-area:foot;font-size:11.5px;font-weight:500;text-align:center;opacity:.75;margin:0}
@media (min-width:860px) and (min-aspect-ratio:11/10){
  main{max-width:1040px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.25fr) minmax(0,1fr) auto;
    grid-template-areas:"head head" "hero games" "hero learn" "foot foot";gap:16px}
  .nm{font-size:19px}
}
@media (max-height:520px){footer,.kicker{display:none}main{gap:8px}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><p class="kicker">MONGFAM · FAMILY ARCADE</p><h1>몽팸<b>게임</b>방</h1></div>
    <span class="count">게임 7개</span>
  </header>

  <a class="tile hero" href="games/plane3d.html" style="--c:var(--sky)">
    <span class="badge">NEW</span><span class="badge b3">3D</span>
    <canvas data-t="plane3d"></canvas>
    <span class="label"><span style="min-width:0"><span class="nm" style="display:block">꼬마 조종사 3D</span><span class="sub">입체 하늘에서 링을 통과해요 · 목적지 10곳</span></span><span class="go">출발!</span></span>
  </a>

  <div class="row games">
    <a class="tile" href="games/skate.html" style="--c:var(--ice)"><canvas data-t="skate"></canvas><span class="label"><span class="nm">아이스 대시</span></span></a>
    <a class="tile" href="games/racing.html" style="--c:var(--grass)"><canvas data-t="race"></canvas><span class="label"><span class="nm">레이싱</span></span></a>
    <a class="tile" href="games/plane.html" style="--c:var(--sky)"><canvas data-t="plane"></canvas><span class="label"><span class="nm">꼬마 조종사</span></span></a>
  </div>

  <div class="row learn">
    <a class="tile" href="../clock/" style="--c:var(--orange)"><span class="tag">배우기</span><canvas data-t="clock"></canvas><span class="label"><span class="nm">시계 놀이</span></span></a>
    <a class="tile" href="../hangul/" style="--c:var(--mint)"><span class="tag">배우기</span><canvas data-t="hangul"></canvas><span class="label"><span class="nm">한글 놀이</span></span></a>
    <a class="tile" href="../../dayoon-english/" style="--c:var(--violet)"><span class="tag">배우기</span><canvas data-t="eng"></canvas><span class="label"><span class="nm">영어 연습</span></span></a>
  </div>

  <footer>하고 싶은 게임을 눌러요. 포인트와 기록은 이 기기에만 저장돼요.</footer>
</main>
<script>
(()=>{
const INK='#1d1b3a',TAU=Math.PI*2;
const cvs=[...document.querySelectorAll('.tile canvas')].map(c=>({c,g:c.getContext('2d'),t:c.dataset.t,w:0,h:0}));
function size(){for(const o of cvs){const r=o.c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);o.w=Math.max(10,r.width);o.h=Math.max(10,r.height);o.c.width=o.w*d;o.c.height=o.h*d;o.g.setTransform(d,0,0,d,0,0);}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function cloud(g,x,y,s){g.fillStyle='#fff';g.beginPath();g.ellipse(x,y,22*s,8*s,0,0,TAU);g.ellipse(x+12*s,y-6*s,13*s,8*s,0,0,TAU);g.ellipse(x-10*s,y-4*s,10*s,6*s,0,0,TAU);g.fill();}
/* 뒤에서 본 비행기 */
function rear(g,s,bank){g.save();g.rotate(bank);g.lineJoin='round';g.lineWidth=2.5;g.strokeStyle=INK;
  g.fillStyle='#d93b3b';rr(g,-34*s,-3*s,68*s,7*s,3*s);g.fill();g.stroke();
  g.fillStyle='#d93b3b';rr(g,-3*s,-26*s,6*s,18*s,2*s);g.fill();g.stroke();rr(g,-13*s,-20*s,26*s,4*s,2*s);g.fill();g.stroke();
  g.fillStyle='#ff5a4d';g.beginPath();g.arc(0,0,11*s,0,TAU);g.fill();g.stroke();
  g.fillStyle='#bfe6ff';g.beginPath();g.arc(0,-2*s,6*s,Math.PI*1.1,Math.PI*1.9);g.fill();g.restore();}
/* 옆에서 본 비행기 */
function side(g,s){g.lineJoin='round';g.lineWidth=2.5;g.strokeStyle=INK;g.fillStyle='#d93b3b';g.beginPath();g.moveTo(-22*s,-4*s);g.lineTo(-29*s,-19*s);g.lineTo(-17*s,-19*s);g.lineTo(-8*s,-4*s);g.closePath();g.fill();g.stroke();
  g.fillStyle='#ff5a4d';rr(g,-25*s,-8*s,50*s,16*s,8*s);g.fill();g.stroke();g.fillStyle='#d93b3b';g.beginPath();g.moveTo(7*s,1*s);g.lineTo(-7*s,1*s);g.lineTo(-17*s,12*s);g.lineTo(-6*s,12*s);g.closePath();g.fill();g.stroke();
  g.fillStyle='#bfe6ff';g.beginPath();g.ellipse(15*s,-3*s,5*s,3.4*s,0,0,TAU);g.fill();g.stroke();}
const D={
 plane3d(g,w,h,t){const H=h*.5;const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#3d9cf0');sk.addColorStop(1,'#cfeeff');g.fillStyle=sk;g.fillRect(0,0,w,H);
  g.fillStyle='#ffe27a';g.beginPath();g.arc(w*.82,H*.42,Math.min(26,h*.1),0,TAU);g.fill();
  cloud(g,w*.2+Math.sin(t*.3)*8,H*.5,Math.min(1.2,w/300));cloud(g,w*.62,H*.72,Math.min(.8,w/420));
  const se=g.createLinearGradient(0,H,0,h);se.addColorStop(0,'#49b4f2');se.addColorStop(1,'#1f6fc0');g.fillStyle=se;g.fillRect(0,H,w,h-H);
  g.strokeStyle='rgba(255,255,255,.3)';for(let k=0;k<7;k++){const f=((t*.5+k/7)%1),y=H+(h-H)*f*f;g.lineWidth=1+f*3;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  const cx=w*.5,cy=h*.42,R0=Math.min(w,h)*.42;
  for(let k=3;k>=0;k--){const z=((k/4-t*.28)%1+1)%1,zz=.12+z*.88,r=R0*(1-zz)*1.6+6,a=Math.min(1,(1-zz)*3);if(r>R0*.92)continue;
    g.globalAlpha=a;g.lineWidth=Math.max(2,r*.16);g.strokeStyle=k%4===1?'#3fd0ff':k%4===3?'hsl('+((t*200)%360)+',95%,62%)':'#ffc93c';g.beginPath();g.arc(cx+Math.sin(k*2.1)*w*.07*zz,cy+Math.cos(k*1.3)*h*.05*zz,r,0,TAU);g.stroke();
    g.lineWidth=Math.max(1,r*.04);g.strokeStyle='#fff';g.beginPath();g.arc(cx+Math.sin(k*2.1)*w*.07*zz,cy+Math.cos(k*1.3)*h*.05*zz,r*.8,0,TAU);g.stroke();}
  g.globalAlpha=1;const px=cx+Math.sin(t*.9)*w*.16,py=h*.52+Math.cos(t*1.3)*h*.05;g.save();g.translate(px,py);rear(g,Math.min(1.5,Math.min(w,h)/150),Math.cos(t*.9)*.35);g.restore();},
 plane(g,w,h,t){const sk=g.createLinearGradient(0,0,0,h);sk.addColorStop(0,'#58b7f5');sk.addColorStop(1,'#d5f0ff');g.fillStyle=sk;g.fillRect(0,0,w,h);
  for(let i=0;i<3;i++){const x=((i*w*.5-t*22)%(w+80)+w+80)%(w+80)-40;cloud(g,x,h*(.2+i*.17),.55);}
  g.strokeStyle='#ffc93c';g.lineWidth=4;g.beginPath();g.ellipse(w*.76,h*.34,5,Math.min(15,h*.14),0,0,TAU);g.stroke();
  g.save();g.translate(w*.42,h*.38+Math.sin(t*2)*4);g.rotate(-.12+Math.sin(t*2)*.06);side(g,Math.min(1,w/110));g.restore();},
 skate(g,w,h,t){g.fillStyle='#2757b8';g.fillRect(0,0,w,h);const H=h-30,cx=w/2,cy=H/2+2,rx=w*.4,ry=Math.max(8,H*.34);g.fillStyle='#eef7ff';g.beginPath();g.ellipse(cx,cy,rx+8,ry+8,0,0,TAU);g.fill();
  g.strokeStyle='rgba(39,87,184,.3)';g.setLineDash([4,5]);g.lineWidth=1.5;g.beginPath();g.ellipse(cx,cy,rx*.5,ry*.5,0,0,TAU);g.stroke();g.setLineDash([]);
  ['#d7263d','#1f3c88','#16b39a','#7b4cd6'].forEach((c,i)=>{const a=-t*(1.5-i*.07)-i*.55,x=cx+Math.cos(a)*rx*.82,y=cy+Math.sin(a)*ry*.78;g.fillStyle='rgba(20,40,80,.18)';g.beginPath();g.ellipse(x+1,y+3,7,3,0,0,TAU);g.fill();
    g.fillStyle=c;g.strokeStyle=INK;g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,6.5,4.5,a+Math.PI/2,0,TAU);g.fill();g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x-Math.sin(a)*5,y+Math.cos(a)*5,3,0,TAU);g.fill();g.stroke();});},
 race(g,w,h,t){g.fillStyle='#3fae5a';g.fillRect(0,0,w,h);const H=h-30,cx=w/2,cy=H/2+2,rx=w*.36,ry=Math.max(8,H*.3);
  const P=a=>[cx+Math.cos(a)*rx*(1+.18*Math.sin(a*3)),cy+Math.sin(a)*ry*(1+.22*Math.cos(a*2))];
  const path=()=>{g.beginPath();for(let i=0;i<=48;i++){const p=P(i/48*TAU);g[i?'lineTo':'moveTo'](p[0],p[1]);}g.closePath();};
  g.lineJoin='round';path();g.strokeStyle='#f2f2f2';g.lineWidth=Math.min(20,H*.3);g.stroke();path();g.strokeStyle='#3b3f46';g.lineWidth=Math.min(15,H*.23);g.stroke();
  [['#ff5a4d',0],['#3fc4ff',1.1],['#ffd23f',2.6]].forEach(([c,o],i)=>{const a=t*(1.25-i*.08)+o,p=P(a),q=P(a+.05);g.save();g.translate(p[0],p[1]);g.rotate(Math.atan2(q[1]-p[1],q[0]-p[0]));g.fillStyle=INK;g.fillRect(-6,-5.5,3.5,11);g.fillRect(3,-5.5,3.5,11);g.fillStyle=c;rr(g,-8,-3.5,16,7,3);g.fill();g.restore();});},
 clock(g,w,h,t){g.fillStyle='#ff9f2e';g.fillRect(0,0,w,h);const H=h-30,cx=w/2,cy=H/2+2,r=Math.max(8,Math.min(H*.42,w*.3));g.fillStyle='#fffaf0';g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill();g.stroke();
  g.fillStyle=INK;for(let i=0;i<12;i++){const a=i*Math.PI/6;g.beginPath();g.arc(cx+Math.sin(a)*r*.8,cy-Math.cos(a)*r*.8,i%3?1.4:2.4,0,TAU);g.fill();}
  const m=t*.6,hr=m/12;g.lineCap='round';g.lineWidth=4;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.sin(hr)*r*.45,cy-Math.cos(hr)*r*.45);g.stroke();g.strokeStyle='#ff5a4d';g.lineWidth=2.5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.sin(m)*r*.72,cy-Math.cos(m)*r*.72);g.stroke();},
 hangul(g,w,h,t){g.fillStyle='#35c9a3';g.fillRect(0,0,w,h);const H=h-30,s=Math.max(12,Math.min(H*.62,w*.24));g.font='400 '+s+'px Jua,"Apple SD Gothic Neo",sans-serif';g.textAlign='center';g.textBaseline='middle';
  ['가','나','다'].forEach((ch,i)=>{const x=w/2+(i-1)*s*1.05,y=H/2+2+Math.sin(t*2.2+i*1.1)*Math.min(5,H*.08);g.lineWidth=5;g.strokeStyle=INK;g.lineJoin='round';g.strokeText(ch,x,y);g.fillStyle=['#fffaf0','#ffd84d','#fffaf0'][i];g.fillText(ch,x,y);});},
 eng(g,w,h,t){g.fillStyle='#7b5cf0';g.fillRect(0,0,w,h);const H=h-30,cx=w/2,cy=H/2+1+Math.sin(t*2)*Math.min(3,H*.05),bw=Math.max(30,Math.min(w*.74,H*1.9)),bh=Math.max(16,Math.min(H*.6,bw*.5));
  g.fillStyle='#fffaf0';g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';rr(g,cx-bw/2,cy-bh/2,bw,bh,Math.min(12,bh/2));g.fill();g.stroke();
  g.beginPath();g.moveTo(cx-bw*.22,cy+bh/2-1);g.lineTo(cx-bw*.3,cy+bh/2+Math.min(9,H*.14));g.lineTo(cx-bw*.06,cy+bh/2-1);g.closePath();g.fill();g.stroke();g.fillRect(cx-bw*.21,cy+bh/2-3,bw*.14,3);
  const s=Math.max(10,Math.min(bh*.62,bw*.26));g.font='400 '+s+'px Jua,"Apple SD Gothic Neo",sans-serif';g.textAlign='center';g.textBaseline='middle';
  ['A','B','C'].forEach((ch,i)=>{g.fillStyle=['#ff5a4d','#1d1b3a','#3fae5a'][i];g.fillText(ch,cx+(i-1)*s*.82,cy+1+Math.sin(t*3+i)*1.5);});}
};
function draw(t){for(const o of cvs){o.g.clearRect(0,0,o.w,o.h);try{D[o.t](o.g,o.w,o.h,t);}catch(e){}}}
size();draw(1.2);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{size();draw(1.2);},100);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw(1.2));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let last=0;const loop=now=>{if(!document.hidden&&now-last>33){last=now;draw(now/1000);}requestAnimationFrame(loop);};requestAnimationFrame(loop);}
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
    var send = function(){ reg.active && reg.active.postMessage({ type: 'cache', urls: performance.getEntriesByType('resource').map(function(e){ return e.name; }).filter(function(u){ return /fonts\.(googleapis|gstatic)\.com/.test(u); }) }); };
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(send);
    addEventListener('pagehide', send);
  }).catch(function(){});
}
</script>
</body>
</html>
