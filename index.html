<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="몽치치 패밀리 — 여행, 게임, 교육을 한곳에">
<meta name="theme-color" content="#fbf4e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몽치치 패밀리">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>몽치치 패밀리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 화면: 위에 이름, 가운데 카테고리 타일(2칸), 타일을 누르면 그 카테고리의 목록으로 바뀜(#주소). */
:root{--ground:#fbf4e6;--paper:#fffdf8;--ink:#2a2440;--ink2:#6b6480;--line:#2a2440;
  --c-travel:#7cc6f2;--c-game:#ffd84d;--c-edu:#8fdcb4;--c-life:#ffb3a1;--c-daily:#c9b5f0;--c-etc:#e9e3d6;
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto}
.kicker{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ink2);margin:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(32px,9.5vw,42px);line-height:1.05;margin:4px 0 2px}
h1 b{font-weight:400;color:#ff6b57}
.lede{font-size:14px;color:var(--ink2);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:128px;padding:14px 14px 12px;text-decoration:none;color:var(--ink);background:var(--c);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.cat:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.cat:focus-visible,.item:focus-visible,.back:focus-visible{outline:4px solid #7b5cf0;outline-offset:3px}
.cat .em{font-size:40px;line-height:1}
.cat .nm{font-family:var(--f-disp);font-size:23px;line-height:1.1;margin-top:8px}
.cat .ct{font-size:12.5px;font-weight:500;opacity:.8;margin-top:2px}
.cat.wide{grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.cat.wide .nm{margin-top:0}
.cat.empty{background:var(--c-etc);border-style:dashed;box-shadow:none}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--line);text-decoration:none;margin-bottom:14px}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.list{display:grid;gap:12px}
#items>.item+.item{margin-top:0}
.item{display:flex;align-items:center;gap:14px;padding:14px;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line)}
.item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.item .em{flex:none;width:58px;height:58px;display:grid;place-items:center;font-size:32px;background:var(--c);border:3px solid var(--line);border-radius:16px}
.item .tx{min-width:0;flex:1}
.item .nm{font-family:var(--f-disp);font-size:20px;line-height:1.15}
.item .ds{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.item .go{flex:none;font-family:var(--f-disp);font-size:18px}
.item.soon{background:transparent;border-style:dashed;box-shadow:none;color:var(--ink2)}
.item.soon .em{background:var(--c-etc)}
.foot{font-size:12px;color:var(--ink2);text-align:center;margin:18px 0 0;line-height:1.6}
.tsum{font-size:13px;font-weight:500;color:var(--ink2);margin:-6px 0 12px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--line)}
.tl li{position:relative;margin:0 0 9px}
.tl li.yr{margin:16px 0 8px -14px}.tl li.yr:first-child{margin-top:0}
.tl li.yr span{display:inline-block;font-family:var(--f-disp);font-size:17px;background:var(--ink);color:var(--ground);border-radius:999px;padding:2px 13px;margin-left:-12px}
.trip{display:flex;align-items:center;gap:11px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--paper);border:2.5px solid var(--line);border-radius:16px}
.trip::before{content:"";position:absolute;left:-22px;top:50%;width:11px;height:11px;margin-top:-7px;border-radius:50%;background:var(--paper);border:3px solid var(--line)}
.trip.has{background:var(--c-travel);box-shadow:0 4px 0 var(--line)}.trip.has::before{background:#ff6b57}
.trip:active{transform:translateY(2px)}
.trip .em{font-size:24px;line-height:1;flex:none}.trip .tx{flex:1;min-width:0}.trip .nm{font-family:var(--f-disp);font-size:18px;line-height:1.2}.trip .ds{font-size:12.5px;color:var(--ink);opacity:.75;margin-top:1px}.trip .go{flex:none;font-family:var(--f-disp);font-size:14px}
h2.sub{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:22px 0 10px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.cat,.item,.back{transition:none}}
</style>
</head>
<body>
<main>
  <section id="home">
    <p class="kicker">MONGCHICHI FAMILY</p>
    <h1>몽치치 <b>패밀리</b></h1>
    <p class="lede" id="hello">우리 가족이 만든 것들을 한곳에 모았어요.</p>
    <div class="grid" id="cats"></div>
    <p class="foot">인터넷이 될 때 한 번 열어 두면 인터넷 없이도 열려요.<br>라이프·일상에 적은 내용은 이 기기에만 저장돼요. <a href="./fam/" style="color:inherit">설정 · 백업</a></p>
  </section>
  <section id="cat" hidden>
    <a class="back" href="#">← 처음으로</a>
    <h1 id="cTitle"></h1>
    <p class="lede" id="cLede"></p>
    <div class="list" id="items"></div>
  </section>
</main>
<script>
/* 새 페이지를 만들면 해당 카테고리의 items에 한 줄만 추가하면 됩니다. soon:true 는 '준비 중' 표시(링크 없음). */
var CATS=[
 {id:'travel',em:'✈️',name:'여행',c:'--c-travel',lede:'2013년부터 다녀온 곳이에요. 누르면 내용이 열려요.',items:[],trips:true},
 {id:'game',em:'🎮',name:'게임',c:'--c-game',lede:'하루 티켓으로 하는 우리 집 게임방이에요.',items:[
   {em:'🕹️',name:'몽팸게임방',ds:'꼬마 조종사 3D · 아이스 대시 · 레이싱 · 티켓과 성적표',href:'./games/'},
   {em:'🛩️',name:'꼬마 조종사 3D',ds:'입체 하늘에서 링을 통과해요',href:'./games/games/plane3d.html'},
   {em:'⛸️',name:'아이스 대시',ds:'쇼트트랙 · 별 모으기 · 메달',href:'./games/games/skate.html'},
   {em:'🏎️',name:'레이싱',ds:'서킷 14개 · 업그레이드',href:'./games/games/racing.html'}]},
 {id:'edu',em:'📚',name:'교육',c:'--c-edu',lede:'놀면서 배우는 것들이에요. 티켓 없이 할 수 있어요.',items:[
   {em:'🕒',name:'시계 놀이',ds:'바늘시계 읽기 · 퀴즈와 바늘 맞추기',href:'./clock/'},
   {em:'🔤',name:'한글 놀이',ds:'글자 만들기 · 듣고 찾기 · 따라 쓰기',href:'./hangul/'},
   {em:'🗣️',name:'영어 연습',ds:'화상영어 스크립트 · 매일 한 장',href:'../dayoon-english/'},
   {em:'📋',name:'코치 퀴즈 · 성적표',ds:'게임방 첫 화면 아래 버튼에서 열어요',href:'./games/'}]},
 {id:'life',em:'🏡',name:'라이프',c:'--c-life',lede:'집에서 자주 쓰는 도구예요.',items:[
   {em:'🗓️',name:'가족 일정표',ds:'이번 주 누가 어디 가는지 · 매주 반복 일정',href:'./life/schedule.html'},
   {em:'🧹',name:'집안일 · 용돈 보드',ds:'집안일을 하면 별 · 용돈이나 게임 티켓으로',href:'./life/chores.html'},
   {em:'🧳',name:'여행 짐 체크',ds:'국내용 · 해외용 준비물',href:'./life/pack.html'},
   {em:'🍽️',name:'주말 외식 장소',ds:'가본 곳과 안 가본 곳 · 어디 갈까 뽑기',href:'./life/eatout.html'}]},
 {id:'daily',em:'📷',name:'일상',c:'--c-daily',lede:'하루하루 쌓이는 기록이에요.',items:[
   {em:'✏️',name:'한 줄 일기장',ds:'가족 모두 오늘의 한 줄',href:'./daily/diary.html'},
   {em:'⛸️',name:'스케이트 기록장',ds:'대회·연습 기록과 종목별 최고 기록',href:'./daily/skate.html'},
   {em:'📏',name:'키 · 몸무게 기록장',ds:'날짜별 기록과 그래프',href:'./daily/growth.html'},
   {em:'📚',name:'읽은 책 목록',ds:'책 제목 · 별점 · 한 줄 느낌',href:'./daily/books.html'}]}
];
/* 여행 연혁: 가이드가 있으면 href, 없으면 눌렀을 때 '기록 준비 중' 화면. note 는 그 화면에 보여 줄 한 줄 메모. */
var TRIPS=[
 {y:2013,name:'팔라우',em:'🇵🇼'},
 {y:2015,name:'프랑스 파리',em:'🇫🇷'},{y:2016,name:'스페인',em:'🇪🇸'},{y:2017,name:'하와이',em:'🌺'},
 {y:2019,name:'발리',em:'🇮🇩'},{y:2019,name:'두 번째 발리',em:'🇮🇩'},
 {y:2022,name:'괌',em:'🇬🇺'},{y:2022,name:'싱가폴',em:'🇸🇬'},{y:2023,name:'나트랑',em:'🇻🇳'},
 {y:2024,name:'아부다비',em:'🇦🇪'},{y:2024,name:'미야코지마',em:'🇯🇵'},
 {y:2025,name:'홍콩 · 마카오',em:'🇭🇰'},{y:2025,name:'푸꾸옥',em:'🇻🇳'},{y:2025,name:'도쿄',em:'🇯🇵'},
 {y:2026,name:'세 번째 발리',em:'🇮🇩'},{y:2026,name:'베이징',em:'🇨🇳'},
 {y:2026,name:'후쿠오카',em:'🇯🇵',href:'./fukuoka/',ds:'8. 21 ~ 8. 25 · 유후인 료칸 · 물놀이'},
 {y:2026,name:'도쿄',em:'🇯🇵'},
 {y:2026,name:'시드니',em:'🇦🇺',href:'./sydney/',ds:'11. 14 ~ 11. 23 · 8박 9일'}
];
var $=function(id){return document.getElementById(id);};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function live(c){return c.trips?TRIPS.length:c.items.filter(function(i){return !i.soon;}).length;}
function renderHome(){var h=new Date().getHours();$('hello').textContent=(h<11?'좋은 아침이에요.':h<18?'안녕하세요.':'좋은 저녁이에요.')+' 어디로 갈까요?';
  $('cats').innerHTML=CATS.map(function(c,i){var n=live(c),odd=CATS.length%2===1&&i===CATS.length-1;
    return '<a class="cat'+(n?'':' empty')+(odd?' wide':'')+'" href="#'+c.id+'" style="--c:var('+c.c+')"><span class="em">'+c.em+'</span><span><span class="nm" style="display:block">'+esc(c.name)+'</span><span class="ct" style="display:block">'+(n?n+(c.trips?'번의 여행':'개'):'준비 중')+'</span></span></a>';}).join('');}
function renderTrips(c){var h='',yr=0,first=TRIPS[0].y,last=TRIPS[TRIPS.length-1].y;
  h+='<p class="tsum">'+first+' — '+last+' · '+TRIPS.length+'번의 여행 · 가이드 '+TRIPS.filter(function(t){return t.href;}).length+'개</p><ol class="tl">';
  TRIPS.forEach(function(t,i){if(t.y!==yr){yr=t.y;h+='<li class="yr"><span>'+yr+'</span></li>';}
    h+='<li><a class="trip'+(t.href?' has':'')+'" href="'+(t.href||'#t'+i)+'"><span class="em">'+t.em+'</span><span class="tx"><span class="nm" style="display:block">'+esc(t.name)+'</span>'+(t.ds?'<span class="ds" style="display:block">'+esc(t.ds)+'</span>':'')+'</span><span class="go">'+(t.href?'가이드 →':'→')+'</span></a></li>';});
  h+='</ol>';
  $('items').innerHTML=h;}
function renderTrip(i){var t=TRIPS[i],n=0;TRIPS.forEach(function(x,j){if(j<=i)n++;});
  $('cTitle').textContent=t.em+' '+t.name;$('cLede').textContent=t.y+'년 · '+n+'번째 여행';
  $('items').innerHTML='<div class="item soon"><span class="em">📝</span><span class="tx"><span class="nm" style="display:block">'+(t.note?esc(t.note):'아직 기록이 없어요')+'</span><span class="ds" style="display:block">사진이나 메모를 모으면 여기에 일정, 다녀온 곳, 기억에 남는 일을 채워 넣어요.</span></span></div>'+
    (i>0?'<a class="item" href="'+(TRIPS[i-1].href||'#t'+(i-1))+'"><span class="em">'+TRIPS[i-1].em+'</span><span class="tx"><span class="ds" style="display:block">이전 여행 · '+TRIPS[i-1].y+'</span><span class="nm" style="display:block">'+esc(TRIPS[i-1].name)+'</span></span><span class="go">←</span></a>':'')+
    (i<TRIPS.length-1?'<a class="item" href="'+(TRIPS[i+1].href||'#t'+(i+1))+'"><span class="em">'+TRIPS[i+1].em+'</span><span class="tx"><span class="ds" style="display:block">다음 여행 · '+TRIPS[i+1].y+'</span><span class="nm" style="display:block">'+esc(TRIPS[i+1].name)+'</span></span><span class="go">→</span></a>':'');}
function renderCat(c){$('cTitle').textContent=c.em+' '+c.name;$('cLede').textContent=c.lede;if(c.trips){renderTrips(c);return;}
  $('items').innerHTML=c.items.length?c.items.map(function(i){var inner='<span class="em">'+i.em+'</span><span class="tx"><span class="nm" style="display:block">'+esc(i.name)+'</span><span class="ds" style="display:block">'+esc(i.ds)+'</span></span>';
    return i.soon?'<div class="item soon" style="--c:var('+c.c+')">'+inner+'<span class="go" style="font-size:13px">준비 중</span></div>':'<a class="item" href="'+i.href+'" style="--c:var('+c.c+')">'+inner+'<span class="go">→</span></a>';}).join('')
    :'<div class="item soon"><span class="em">🌱</span><span class="tx"><span class="nm" style="display:block">아직 비어 있어요</span><span class="ds" style="display:block">새로 만들면 여기에 생겨요.</span></span></div>';}
function route(){var id=location.hash.replace('#',''),c=null,back=document.querySelector('.back');for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)c=CATS[i];
  var m=/^t(\d+)$/.exec(id);if(m&&TRIPS[+m[1]]){$('home').hidden=true;$('cat').hidden=false;back.setAttribute('href','#travel');back.textContent='← 여행 연혁';renderTrip(+m[1]);document.title=TRIPS[+m[1]].name+' · 몽치치 패밀리';scrollTo(0,0);return;}
  back.setAttribute('href','#');back.textContent='← 처음으로';
  $('home').hidden=!!c;$('cat').hidden=!c;if(c){renderCat(c);document.title=c.name+' · 몽치치 패밀리';}else{renderHome();document.title='몽치치 패밀리';}scrollTo(0,0);}
addEventListener('hashchange',route);route();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
    var send = function(){ reg.active && reg.active.postMessage({ type: 'cache', urls: performance.getEntriesByType('resource').map(function(e){ return e.name; }).filter(function(u){ return /fonts\.(googleapis|gstatic)\.com/.test(u); }) }); };
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(send);
    addEventListener('pagehide', send);
  }).catch(function(){});
  // 여행 가이드·게임방·시계·한글도 미리 저장해 둡니다(이 화면만 열어도 기기에 저장됨)
  ['./sydney/','./games/','./clock/','./hangul/'].forEach(function(d){ navigator.serviceWorker.register(d+'sw.js',{scope:d}).catch(function(){}); });
}
</script>
</body>
</html>
