<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf4e6">
<title>집안일 · 용돈 보드 · 몽치치 패밀리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../fam/fam.css">
<style>

</style>
</head>
<body>
<main>
<div id="who"></div>
<div class="card" id="bal"></div>
<h2 class="sec">오늘 할 일</h2>
<div id="list"></div>
<div class="row" style="gap:8px;margin:4px 0 0"><button class="btn sm" id="addC">+ 집안일 추가</button><button class="btn sm" id="rate">별 값 정하기</button></div>
<h2 class="sec">받은 기록</h2>
<div id="hist"></div>
</main>
<script src="../fam/fam.js"></script>
<script src="../games/games/ticket.js"></script>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id);};
MF.head('집안일 · 용돈 보드','life','집안일을 하고 체크하면 별이 쌓여요. 별은 용돈이나 게임 티켓으로 바꿔요.');
var DEF={chores:[{id:'c1',name:'내 방 정리하기',star:1},{id:'c2',name:'신발 가지런히 놓기',star:1},{id:'c3',name:'책가방 미리 싸기',star:1},{id:'c4',name:'식탁 차리기 돕기',star:1},{id:'c5',name:'빨래 개기',star:2},{id:'c6',name:'분리수거 돕기',star:2}],log:{},bal:{},rate:100,hist:[]};
var D=MF.load('chores',null)||DEF,who=null,TK=3;
function save(){MF.save('chores',D);}
function key(){return who+'|'+MF.ymd();}
function draw(){var m=MF.member(who),b=D.bal[who]|0,done=D.log[key()]||[];
  $('bal').innerHTML='<div class="row"><div class="grow"><div class="muted">'+MF.esc(m.name)+' · 모은 별</div><div class="big">⭐ '+b+'개 <span class="muted" style="font-family:var(--f-body)">= '+(b*D.rate).toLocaleString()+'원</span></div></div></div>'+
    '<div class="row" style="gap:8px;margin-top:10px"><button class="btn sm" id="pay"'+(b?'':' disabled')+'>용돈으로 받기</button><button class="btn sm" id="tk"'+(b>=TK?'':' disabled')+'>별 '+TK+'개 → 게임 티켓 1장</button></div>';
  $('list').innerHTML=D.chores.length?D.chores.map(function(c){var on=done.indexOf(c.id)>=0;return '<div class="card row"><button class="ck" data-ck="'+c.id+'" aria-pressed="'+on+'" aria-label="'+MF.esc(c.name)+' 체크">'+(on?'✓':'')+'</button><span class="grow'+(on?' done':'')+'" data-ed="'+c.id+'">'+MF.esc(c.name)+'</span><span class="chip" style="--c:#ffd84d">⭐ '+c.star+'</span></div>';}).join(''):'<div class="empty">집안일을 추가해 주세요.</div>';
  var hs=D.hist.filter(function(x){return x.who===who;}).slice(-8).reverse();
  $('hist').innerHTML=hs.length?hs.map(function(x){return '<div class="card row"><span class="grow">'+MF.day(x.d)+'</span><span>'+(x.t==='pay'?'용돈 '+(x.won||0).toLocaleString()+'원':'게임 티켓 1장')+' <span class="muted">(별 '+x.stars+'개)</span></span></div>';}).join(''):'<div class="empty">아직 받은 기록이 없어요.</div>';}
MF.who($('who'),{kids:true},function(id){who=id;draw();});
$('list').onclick=function(e){var b=e.target.closest('[data-ck]');
  if(b){var c=D.chores.filter(function(x){return x.id===b.dataset.ck;})[0],l=D.log[key()]||(D.log[key()]=[]),i=l.indexOf(c.id);
    if(i>=0){if((D.bal[who]|0)<c.star){MF.toast('이미 쓴 별이라 취소할 수 없어요');return;}l.splice(i,1);D.bal[who]=(D.bal[who]|0)-c.star;}else{l.push(c.id);D.bal[who]=(D.bal[who]|0)+c.star;MF.toast('⭐ +'+c.star+' 잘했어요!');}
    save();draw();return;}
  var ed=e.target.closest('[data-ed]');if(ed){var c2=D.chores.filter(function(x){return x.id===ed.dataset.ed;})[0];editC(c2);}};
function editC(c){MF.form({title:c?'집안일 고치기':'집안일 추가',value:c||{star:1},fields:[{k:'name',label:'집안일',req:true,max:20,ph:'예: 화분에 물 주기'},{k:'star',label:'별 몇 개',type:'opts',opts:[[1,'⭐ 1'],[2,'⭐ 2'],[3,'⭐ 3']]}],
  onSave:function(v){v.star=+v.star||1;if(c)Object.assign(c,v);else{v.id=MF.uid();D.chores.push(v);}save();draw();},onDelete:c?function(){D.chores=D.chores.filter(function(x){return x!==c;});save();draw();}:null});}
$('addC').onclick=function(){editC(null);};
$('rate').onclick=function(){MF.form({title:'별 1개의 값',value:{rate:D.rate},fields:[{k:'rate',label:'별 1개에 몇 원',type:'number',step:10,req:true}],onSave:function(v){D.rate=Math.max(0,Math.round(+v.rate)||0);save();draw();}});};
$('bal').onclick=function(e){var b=e.target.closest('button');if(!b)return;var n=D.bal[who]|0,m=MF.member(who);
  if(b.id==='pay'){if(!confirm(m.name+'에게 별 '+n+'개 = '+(n*D.rate).toLocaleString()+'원을 주셨나요?\n확인을 누르면 별이 0개가 돼요.'))return;D.hist.push({d:MF.ymd(),who:who,t:'pay',stars:n,won:n*D.rate});D.bal[who]=0;save();draw();MF.toast('용돈 기록 완료');}
  if(b.id==='tk'){if(!window.MongGate){MF.toast('게임방 티켓을 불러오지 못했어요');return;}var r=MongGate.grant(m.name);
    if(r==='ok'){D.bal[who]=n-TK;D.hist.push({d:MF.ymd(),who:who,t:'tk',stars:TK});save();draw();MF.toast('🎟 티켓 1장을 받았어요');}
    else MF.toast(r==='max'?'오늘은 티켓을 더 받을 수 없어요':'게임방에 '+m.name+' 선수가 없어요');}};
})();
</script>
</body>
</html>
