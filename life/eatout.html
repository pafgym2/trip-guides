<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf4e6">
<title>주말 외식 장소 · 몽치치 패밀리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../fam/fam.css">
<style>

</style>
</head>
<body>
<main>
<div class="mf-tabs" id="tabs"><button data-t="todo">안 가본 곳</button><button data-t="went">가본 곳</button></div>
<button class="btn" id="dice" style="width:100%;margin:0 0 12px">🎲 이번 주말 어디 갈까?</button>
<div id="list"></div>
<button class="mf-add" id="add">+ 장소 추가</button>
</main>
<script src="../fam/fam.js"></script>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id);};
MF.head('주말 외식 장소','life','가 보고 싶은 곳과 가 본 곳을 나눠 모아요.');
var D=MF.load('eatout',[]),tab='todo',pick=null;
function save(){MF.save('eatout',D);}
function map(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+(p.area||''));}
function draw(){$('tabs').querySelectorAll('button').forEach(function(b){var n=D.filter(function(p){return !!p.went===(b.dataset.t==='went');}).length;b.setAttribute('aria-pressed',b.dataset.t===tab);b.textContent=(b.dataset.t==='went'?'가본 곳 ':'안 가본 곳 ')+n;});
  var l=D.filter(function(p){return !!p.went===(tab==='went');});if(tab==='went')l.sort(function(a,b){return (b.date||'')<(a.date||'')?-1:1;});
  $('list').innerHTML=l.length?l.map(function(p){return '<div class="card'+(pick===p.id?' pick':'')+'" data-id="'+p.id+'"'+(pick===p.id?' style="background:#fff6cf"':'')+'><div class="row"><h2 class="grow" data-ed="1">'+MF.esc(p.name)+'</h2>'+(p.went&&p.stars?'<span>'+MF.stars(p.stars)+'</span>':'')+'</div>'+
    '<div>'+(p.area?'<span class="chip">'+MF.esc(p.area)+'</span> ':'')+(p.kind?'<span class="chip" style="--c:#8fdcb4">'+MF.esc(p.kind)+'</span> ':'')+(p.went&&p.date?'<span class="muted">'+MF.day(p.date,true)+'</span>':'')+'</div>'+
    (p.memo?'<div class="muted" style="margin-top:5px">'+MF.esc(p.memo)+'</div>':'')+
    '<div class="row" style="gap:8px;margin-top:9px"><a class="btn sm" href="'+map(p)+'" target="_blank" rel="noopener" style="text-decoration:none">지도 ↗</a>'+(p.went?'<button class="btn sm" data-a="again">다시 가고 싶어요</button>':'<button class="btn sm" data-a="went">다녀왔어요</button>')+'</div></div>';}).join('')
    :'<div class="empty">'+(tab==='went'?'아직 가본 곳이 없어요.':'가 보고 싶은 곳을 추가해 주세요.')+'</div>';}
var KINDS=[['한식','한식'],['고기','고기'],['면','면'],['일식','일식'],['중식','중식'],['양식','양식'],['카페·빵','카페·빵'],['기타','기타']];
function edit(p,went){var f=[{k:'name',label:'가게 이름',req:true,max:24},{k:'area',label:'동네',max:14,ph:'예: 과천'},{k:'kind',label:'종류',type:'opts',opts:KINDS},{k:'memo',label:'메모',type:'textarea',max:120,ph:'누가 추천했는지, 뭐가 맛있는지'}];
  var isWent=went||(p&&p.went)||(!p&&tab==='went');if(isWent)f.splice(3,0,{k:'date',label:'다녀온 날',type:'date'},{k:'stars',label:'별점',type:'stars'});
  MF.form({title:p?(went?'다녀온 기록':'장소 고치기'):'장소 추가',value:p?Object.assign({},p,went?{date:p.date||MF.ymd()}:{}):{kind:'한식'},fields:f,
    onSave:function(v){if(v.stars)v.stars=+v.stars;if(went){v.went=true;tab='went';}if(p)Object.assign(p,v);else{v.id=MF.uid();v.went=tab==='went';D.push(v);}pick=null;save();draw();MF.toast('저장했어요');},
    onDelete:p?function(){D=D.filter(function(x){return x!==p;});save();draw();}:null});}
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;pick=null;draw();};
$('list').onclick=function(e){var c=e.target.closest('.card');if(!c||e.target.closest('a'))return;var p=D.filter(function(x){return x.id===c.dataset.id;})[0];if(!p)return;var b=e.target.closest('button');
  if(b&&b.dataset.a==='went'){edit(p,true);return;}if(b&&b.dataset.a==='again'){p.went=false;tab='todo';save();draw();MF.toast('안 가본 곳으로 옮겼어요');return;}
  if(e.target.closest('[data-ed]'))edit(p);};
$('add').onclick=function(){edit(null);};
$('dice').onclick=function(){var l=D.filter(function(p){return !p.went;}),t='todo';if(!l.length){l=D.filter(function(p){return p.went&&(p.stars|0)>=4;});t='went';}
  if(!l.length){MF.toast('먼저 장소를 추가해 주세요');return;}var p=l[Math.floor(Math.random()*l.length)];tab=t;pick=p.id;draw();MF.toast('🎲 '+p.name+' 어때요?');var el=document.querySelector('.card.pick');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});};
draw();
MF.live(['eatout'],function(){D=MF.load('eatout',[]);draw();});
})();
</script>
</body>
</html>
